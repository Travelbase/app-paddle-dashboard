<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Paddle Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #e4e7ed;
    --bg-grad: linear-gradient(145deg, #e0e3ea 0%, #e8ebf0 35%, #dfe2e9 65%, #e6e9ef 100%);
    --bg-card: #e4e7ed;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --shadow: 16px 16px 40px rgba(0,0,0,0.22), -16px -16px 40px rgba(255,255,255,0.95);
    --shadow-lg: 20px 20px 50px rgba(0,0,0,0.25), -20px -20px 50px rgba(255,255,255,1);
    --shadow-hover: 18px 18px 44px rgba(0,0,0,0.24), -18px -18px 44px rgba(255,255,255,0.97);
    --radius: 14px;
    --scorecard-1: #2563eb;
    --scorecard-2: #059669;
    --scorecard-3: #d97706;
    --scorecard-4: #7c3aed;
  }
  [data-theme="dark"] .canoe-hero { display: none; }
  [data-theme="dark"] {
    --bg: #1a2332;
    --bg-grad: linear-gradient(145deg, #182030 0%, #1c2536 35%, #172030 65%, #1b2434 100%);
    --bg-card: #1a2332;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --shadow: 16px 16px 40px rgba(0,0,0,0.6), -16px -16px 40px rgba(255,255,255,0.06);
    --shadow-lg: 20px 20px 50px rgba(0,0,0,0.65), -20px -20px 50px rgba(255,255,255,0.07);
    --shadow-hover: 24px 24px 60px rgba(0,0,0,0.7), -24px -24px 60px rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    transition: background 0.3s, color 0.3s;
  }
  .container { max-width: 1360px; margin: 0 auto; padding: 24px; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .theme-toggle {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; color: var(--text); font-size: 0.85rem;
    transition: all 0.2s;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  /* Scroll to top */
  .scroll-top {
    position: fixed; bottom: 24px; right: 24px; z-index: 900;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-card); border: 1px solid var(--border);
    box-shadow: var(--shadow); cursor: pointer; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, border-color 0.2s;
    font-size: 1rem; line-height: 1;
  }
  .scroll-top.visible { opacity: 1; pointer-events: auto; }
  .scroll-top:hover { border-color: var(--accent); color: var(--accent); }

  /* Filter bar */
  .filter-bar { margin-bottom: 24px; }
  .filter-trip-grid { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .filter-row {
    display: inline-flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 14px; padding: 5px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.12), -8px -8px 20px rgba(255,255,255,0.7);
  }
  .filter-row-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); font-weight: 600; margin-bottom: 4px;
  }
  .filter-btn {
    padding: 7px 16px; border-radius: 10px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    font-size: 0.8rem; font-weight: 500; transition: all 0.25s ease;
  }
  .filter-btn:hover { color: var(--text); background: rgba(0,0,0,0.04); }
  .filter-btn.active {
    background: #4c1d95; color: #fff; font-weight: 600;
    box-shadow: 0 2px 4px rgba(76,29,149,0.2), 0 4px 12px rgba(76,29,149,0.25), 0 8px 24px rgba(76,29,149,0.15);
    border-radius: 10px;
  }
  .filter-btn.disabled { opacity: 0.25; pointer-events: none; }
  [data-theme="dark"] .filter-row {
    box-shadow: 8px 8px 20px rgba(0,0,0,0.4), -8px -8px 20px rgba(255,255,255,0.03);
  }
  [data-theme="dark"] .filter-btn:hover { background: rgba(255,255,255,0.06); }
  [data-theme="dark"] .filter-btn.active {
    background: #7c3aed; color: #fff;
    box-shadow: 0 2px 4px rgba(124,58,237,0.3), 0 4px 12px rgba(124,58,237,0.35), 0 8px 24px rgba(124,58,237,0.2);
  }

  /* Loading */
  .loading-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; gap: 16px; transition: opacity 0.4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sparkle {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .sparkle {
    background: linear-gradient(90deg, var(--accent), #ec4899, #f59e0b, var(--accent));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: sparkle 3s ease-in-out infinite;
  }

  /* Scorecards */
  .scorecards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .scorecard {
    background: var(--bg-card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); border-left: 4px solid var(--scorecard-1);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .scorecard:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .scorecard:nth-child(2) { border-left-color: var(--scorecard-2); }
  .scorecard:nth-child(3) { border-left-color: var(--scorecard-3); }
  .scorecard:nth-child(4) { border-left-color: var(--scorecard-4); }
  .scorecard-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; }
  .scorecard-value { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; text-shadow: 1px 1px 2px rgba(0,0,0,0.06); }
  .scorecard-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
  .sc-toggle { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: middle; }
  .sc-toggle button {
    padding: 1px 6px; font-size: 0.62rem; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-muted); border-radius: 4px;
    cursor: pointer; text-transform: uppercase; font-weight: 600; line-height: 1.4;
  }
  .sc-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sc-scroll-btn { float: right; padding: 1px 5px; font-size: 0.65rem; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); border-radius: 4px; cursor: pointer; line-height: 1.4; vertical-align: middle; }
  .sc-scroll-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Charts grid */
  .charts-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; margin-bottom: 24px;
  }
  .chart-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow); transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .chart-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .chart-card.full-width { grid-column: 1 / -1; }
  .chart-card h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .chart-wrapper {
    position: relative; width: 100%; background: var(--bg-card); border-radius: 12px; padding: 8px;
    box-shadow: inset 3px 3px 8px rgba(0,0,0,0.06), inset -3px -3px 8px rgba(255,255,255,0.4);
  }
  [data-theme="dark"] .chart-wrapper {
    box-shadow: inset 3px 3px 8px rgba(0,0,0,0.25), inset -3px -3px 8px rgba(255,255,255,0.02);
  }
  .chart-wrapper.line-h { height: 280px; }
  .chart-wrapper.bar-h { height: 280px; }
  .chart-wrapper.bar-tall { height: 400px; }
  .chart-wrapper.pie-h { height: 300px; }

  /* Persona cards */
  .persona-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 20px; }
  @media (max-width: 900px) { .persona-grid { grid-template-columns: 1fr; } }
  .persona-card {
    position: relative; border-radius: 16px; padding: 28px 24px 24px;
    display: flex; align-items: flex-start; gap: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: transform 0.3s cubic-bezier(.4,0,.2,1), box-shadow 0.3s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  .persona-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), #8b5cf6); opacity: 0;
    transition: opacity 0.3s ease;
  }
  .persona-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); }
  .persona-card:hover::before { opacity: 1; }
  .persona-avatar-wrap {
    width: 90px; height: 90px; border-radius: 50%; flex-shrink: 0;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -0.02em;
    box-shadow: 0 4px 16px rgba(139,92,246,0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .persona-card:hover .persona-avatar-wrap { transform: scale(1.05); box-shadow: 0 6px 24px rgba(139,92,246,0.35); }
  .persona-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .persona-info { flex: 1; min-width: 0; }
  .persona-name { font-size: 1.05rem; font-weight: 800; color: var(--text); margin-bottom: 2px; letter-spacing: -0.01em; }
  .persona-tagline {
    display: inline-block; font-size: 0.65rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    padding: 2px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;
  }
  .persona-stats { font-size: 0.78rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 10px; }
  .persona-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .persona-tag {
    font-size: 0.68rem; padding: 3px 10px; border-radius: 20px;
    background: var(--bg); color: var(--text-muted);
    border: 1px solid var(--border); transition: border-color 0.2s ease;
  }
  .persona-card:hover .persona-tag { border-color: var(--accent); }
  .persona-quote {
    font-size: 0.8rem; font-style: italic; color: var(--text-muted);
    line-height: 1.5; position: relative; padding-left: 14px;
  }
  .persona-quote::before {
    content: "\201C"; position: absolute; left: -2px; top: -6px;
    font-size: 2rem; font-weight: 800; color: var(--accent); opacity: 0.3; font-style: normal;
  }

  /* Table */
  .table-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 24px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .table-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .table-card .table-body { overflow-x: auto; }
  .table-card .charts-grid { margin-bottom: 0; }
  .table-card .charts-grid .chart-card { min-width: 0; }
  .table-card h3 {
    font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none;
  }
  .table-card h3::after {
    content: ""; display: inline-block; width: 6px; height: 6px;
    border-right: 2px solid var(--text-muted); border-bottom: 2px solid var(--text-muted);
    transform: rotate(45deg); transition: transform 0.2s; margin-left: auto;
  }
  .table-card .table-body {
    max-height: 5000px; overflow: hidden; overflow: clip;
    transition: max-height 0.4s ease-in-out, opacity 0.3s ease, margin-top 0.3s ease;
    opacity: 1; margin-top: 12px; padding: 8px 12px; border-radius: var(--radius);
  }
  .table-card.collapsed h3 { margin-bottom: 0; }
  .table-card.collapsed h3::after { transform: rotate(-45deg); }
  .table-card.collapsed .table-body { max-height: 0; opacity: 0; margin-top: 0; }
  .member-wrap { overflow: hidden; transition: height 0.3s ease, opacity 0.3s ease; opacity: 1; }
  .member-wrap.collapsed { height: 0 !important; opacity: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border);
    color: var(--text-muted); font-weight: 600; text-transform: uppercase;
    font-size: 0.72rem; letter-spacing: 0.05em; white-space: nowrap;
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .trip-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 500; white-space: nowrap;
    background: var(--border); color: var(--text);
  }

  /* Weekly table */
  .weekly-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 24px; overflow-x: auto;
  }
  .weekly-card h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .weekly-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: center; }
  .weekly-table th {
    padding: 8px 6px; border-bottom: 2px solid var(--border);
    color: var(--text-muted); font-weight: 600; text-transform: uppercase;
    font-size: 0.72rem; letter-spacing: 0.05em;
    position: sticky; top: 0; background: var(--bg-card); z-index: 2;
  }
  .weekly-table-wrap { max-height: 480px; overflow-y: auto; }
  .weekly-table td { padding: 6px; border-bottom: 1px solid var(--border); }
  .weekly-table tr:hover td { background: var(--border); }
  .weekly-table td:first-child, .weekly-table th:first-child { text-align: left; font-weight: 600; }
  .weekly-table .current-week, .weekly-table tr:hover .current-week { background: var(--accent); color: #fff; border-radius: 4px; font-weight: 700; }
  .weekly-table .totals-row td { border-top: 2px solid var(--border); font-weight: 700; }
  .weekly-table .cell-pos { color: #16a34a; }
  .weekly-table .cell-neg { color: #dc2626; }

  /* Revenue overview — compact card in scorecards grid */
  .revenue-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 16px;
    box-shadow: var(--shadow), -4px 0 12px rgba(22,163,106,0.2); border-left: 4px solid #16a34a;
    grid-column: span 2;
  }
  .revenue-card h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
  .revenue-rows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 24px; }
  .revenue-row {
    display: flex; flex-direction: column; gap: 1px;
    padding: 4px 0; font-size: 0.8rem;
  }
  .revenue-row .rev-label { color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .revenue-row .rev-value { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1rem; position: relative; text-shadow: 1px 1px 2px rgba(0,0,0,0.06); }
  .rev-value[data-tip] { cursor: default; }
  .rev-value[data-tip]::after {
    content: attr(data-tip);
    position: absolute; top: 110%; left: 0;
    background: var(--text); color: var(--bg); font-size: 0.7rem; font-weight: 400;
    padding: 6px 10px; border-radius: 6px; white-space: pre;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    z-index: 100;
  }
  .rev-value[data-tip]:hover::after { opacity: 1; }
  .revenue-row.rev-highlight {
    background: #16a34a18; border-radius: 10px; padding: 8px 10px; border: none;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.06), -4px -4px 10px rgba(255,255,255,0.5);
  }
  [data-theme="dark"] .revenue-row.rev-highlight {
    box-shadow: 4px 4px 10px rgba(0,0,0,0.25), -4px -4px 10px rgba(255,255,255,0.02);
  }
  .revenue-row.rev-highlight .rev-label { color: #16a34a; font-weight: 600; }
  .revenue-row.rev-highlight .rev-value { color: #16a34a; }
  .revenue-row.rev-target {
    background: #2563eb18; border-radius: 10px; padding: 8px 10px; border: none;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.06), -4px -4px 10px rgba(255,255,255,0.5);
  }
  [data-theme="dark"] .revenue-row.rev-target {
    box-shadow: 4px 4px 10px rgba(0,0,0,0.25), -4px -4px 10px rgba(255,255,255,0.02);
  }
  .revenue-row.rev-target .rev-label { font-weight: 600; color: #2563eb; }
  .revenue-row.rev-target .rev-value { color: #2563eb; }
  .rev-pct { font-size: 0.72rem; color: var(--text-muted); margin-left: 6px; }
  @media (max-width: 768px) { .revenue-card { grid-column: span 1; } .revenue-rows { grid-template-columns: 1fr; } }

  /* Pace tracker */
  .pace-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 16px;
    box-shadow: var(--shadow), -4px 0 12px rgba(139,92,246,0.2); border-left: 4px solid #8b5cf6;
    grid-column: span 2;
  }
  .pace-card h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
  .pace-rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 24px; }
  .pace-row {
    display: flex; flex-direction: column; gap: 1px;
    padding: 4px 0; font-size: 0.8rem;
  }
  .pace-row .pace-label { color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .pace-row .pace-value { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.06); }
  .pace-row.pace-good .pace-value { color: #16a34a; }

  .pace-row.pace-warn .pace-value { color: #f59e0b; }
  .pace-row.pace-bad .pace-value { color: #ef4444; }
  .pace-row.pace-highlight {
    background: #8b5cf618; border-radius: 10px; padding: 8px 10px;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.06), -4px -4px 10px rgba(255,255,255,0.5);
  }
  [data-theme="dark"] .pace-row.pace-highlight {
    box-shadow: 4px 4px 10px rgba(0,0,0,0.25), -4px -4px 10px rgba(255,255,255,0.02);
  }
  .pace-row.pace-highlight .pace-label { color: #8b5cf6; font-weight: 600; }
  .pace-row.pace-highlight .pace-value { color: #8b5cf6; }
  td[data-tip] { position: relative; cursor: help; }
  td[data-tip]::after {
    content: attr(data-tip);
    position: absolute; top: 100%; right: 0;
    background: var(--text); color: var(--bg); font-size: 0.7rem; font-weight: 400;
    padding: 6px 10px; border-radius: 6px; white-space: pre;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    z-index: 100; min-width: 160px;
  }
  td[data-tip]:hover::after { opacity: 1; }
  .scorecard-value span[data-tip] { position: relative; cursor: default; display: inline-block; }
  .scorecard-value span[data-tip]::after {
    content: attr(data-tip);
    position: absolute; top: 110%; left: 0;
    background: var(--text); color: var(--bg); font-size: 0.72rem; font-weight: 400;
    padding: 7px 12px; border-radius: 6px; white-space: pre;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    z-index: 100; min-width: 180px;
  }
  .scorecard-value span[data-tip]:hover::after { opacity: 1; }
  #detail-cards div[data-tip]::after {
    content: attr(data-tip);
    position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); font-size: 0.72rem; font-weight: 400;
    padding: 6px 10px; border-radius: 6px; white-space: pre;

function getFirst(row)   { return (row.firstname || "").trim(); }
function getLast(row)    { return (row.lastname || "").trim(); }
function getLang(row)    { return row.language || null; }
function getCountry(row) { return row.country || null; }

function getSegment(row) {
  const c = (getCountry(row) || "").toUpperCase();
  const l = (getLang(row) || "").toLowerCase();
  if (c === "BE" && l === "nl") return "Vlamingen";
  if (c === "BE" && l === "fr") return "Walloons";
  if (c === "NL") return "Dutchies";
  if (c === "DE") return "Germans";
  if (c === "FR") return "Frenchies";
  return "Other";
}

function getTripLabel(row) {
  const info = PROJECT_MAP[row.project_id];
  if (info) return info.label + " '" + String(info.year).slice(-2);
  // Fallback: derive from tour_name + period year
  const name = row.tour_name || "Unknown";
  const ds = row.period_date_start || "";
  const y = ds.slice(0, 4);
  return name + (y ? " '" + y.slice(-2) : "");
}

function getTripYear(row) {
  const info = PROJECT_MAP[row.project_id];
  return info ? info.year : null;
}

function getTripCategory(row) {
  const info = PROJECT_MAP[row.project_id];
  return info ? info.category : "other";
}

// Returns the base trip name (without year), e.g. "Canoe Trip", "Packraft Slovenia"
function getTripBase(row) {
  const info = PROJECT_MAP[row.project_id];
  const label = info ? info.label : (row.tour_name || "Unknown");
  // Split "The Canoe Trip" into Classic vs Short
  if (label === "The Canoe Trip") {
    return getTripType(row) === "Short" ? "The Canoe Trip Short" : "The Canoe Trip Classic";
  }
  if (label === "Canoe Tribe") {
    const tour = (getTourName(row) || "").toLowerCase();
    return tour.includes("3-day") ? "Canoe Tribe Short" : "Canoe Tribe Classic";
  }
  // Split Ardennes 2025 into Semoy / Mullerthal based on trip start date
  // April 5 – June 14 → Semoy, June 15 – October 5 → Mullerthal
  if (label === "The Packraft Trail Ardennes") {
    const ps = (row.period_date_start || "").slice(0, 10);
    if (ps && ps <= "2025-06-14") return "The Packraft Trail Semoy";
    if (ps && ps >= "2025-06-15") return "The Packraft Trail Mullerthal";
  }
  return label;
}

// ─── FETCH DATA ────────────────────────────────────────────────────
async function fetchJSON(query) {
  const res = await fetch(PROXY_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(query),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error("Non-JSON response"); }
  return Array.isArray(data) ? data : (data.data || data.rows || []);
}

async function fetchAll() {
  const [main, visits, leads] = await Promise.all([
    fetchJSON(UNIFIED_QUERY),
    fetchJSON(WEBSTATS_QUERY).catch(() => []),
    fetchJSON(LEADS_QUERY).catch(() => []),
  ]);
  allData = main;
  webVisits = visits;
  leadsData = leads;

  // Fetch detailed APIs in parallel (non-blocking — dashboard works without them)
  const detailEntries = Object.entries(DETAIL_APIS);
  const detailResults = await Promise.all(
    detailEntries.map(([pid, q]) => fetchJSON({ id: q.id, key: q.key }).catch(() => []))
  );
  detailData = {};
  detailEntries.forEach(([pid], i) => { detailData[pid] = detailResults[i]; });

  lastRefreshed = new Date();
}

// ─── FILTERED DATA ─────────────────────────────────────────────────
function passesTripFilter(base) {
  if (filterGroup !== "all") {
    const groupTrips = TRIP_GROUPS[filterGroup];
    if (!groupTrips || !groupTrips.includes(base)) return false;
  }
  if (filterTrips.size > 0 && !filterTrips.has(base)) return false;
  return true;
}

function getLangGroup(r) {
  const lang = (getLang(r) || "").toLowerCase();
  if (lang === "nl") return "NL";
  if (lang === "fr") return "FR";
  if (lang === "de") return "DE";
  return "EN";
}

function passesLangFilter(r) {
  return filterLang === "all" || getLangGroup(r) === filterLang;
}

function getPrevYear() {
  const years = [...new Set(allData.map(getTripYear).filter(Boolean))].sort((a, b) => b - a);
  return years.find(y => y < filterYear) || null;
}

// All data filtered by trip + language (no year filter)
function filteredAll() {
  return allData.filter(r => passesTripFilter(getTripBase(r)) && passesLangFilter(r));
}

// Data filtered by trip + language + current year
function filtered() {
  return filteredAll().filter(r => getTripYear(r) === filterYear);
}

// ─── COUNT-UP ANIMATION ────────────────────────────────────────────
function animateValue(el, end, duration = 600, prefix = "", suffix = "") {
  if (!el) return;
  const start = 0;
  const range = end - start;
  if (range === 0) { el.textContent = prefix + end.toLocaleString() + suffix; return; }
  const startTime = performance.now();
  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // Ease out cubic
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.round(start + range * eased);
    el.textContent = prefix + current.toLocaleString() + suffix;
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function updateScorecards(data) {
  const total = data.length;
  const revenue = data.reduce((s, r) => s + getPrice(r), 0);

  // Compute target progress from 2026 data, respecting lang filter
  const data2026 = filteredAll().filter(r => getTripYear(r) === 2026);
  const booked2026 = {};
  for (const r of data2026) {
    const base = getTripBase(r);
    booked2026[base] = (booked2026[base] || 0) + 1;
  }
  const langKey = filterLang !== "all" ? filterLang.toLowerCase() : null;
  const relevantTargets = Object.entries(TARGETS)
    .filter(([name]) => passesTripFilter(name));
  const totalBooked = relevantTargets.reduce((s, [name]) => s + (booked2026[name] || 0), 0);
  const totalTarget = relevantTargets.reduce((s, [, t]) => s + (langKey ? Math.round(t.target * (t[langKey] || 0) / 100) : t.target), 0);
  const targetPct = totalTarget > 0 ? ((totalBooked / totalTarget) * 100).toFixed(0) : 0;

  animateValue(document.getElementById("sc-total"), total);
  document.getElementById("sc-total-sub").textContent = "";
  const targetsCard = document.getElementById("sc-targets").closest(".scorecard");
  if (filterYear === 2025) {
    targetsCard.style.opacity = "0.35";
    targetsCard.title = "No targets set for 2025";
    document.getElementById("sc-targets").textContent = "—";
    document.getElementById("sc-targets-sub").textContent = "";
  } else {
    targetsCard.style.opacity = "";
    targetsCard.title = "";
    animateValue(document.getElementById("sc-targets"), totalTarget);
    document.getElementById("sc-targets-sub").textContent = targetPct + "% booked";
  }

  // New participants in recent period (calendar-based)
  const recentCard = document.getElementById("sc-recent").closest(".scorecard");
  if (filterYear === 2025) {
    recentCard.style.opacity = "0.35";
    recentCard.title = "Only relevant for the current season";
    document.getElementById("sc-recent").textContent = "—";
    document.getElementById("sc-recent-sub").textContent = "";
  } else {
    recentCard.style.opacity = "";
    recentCard.title = "";
    const now = new Date();
    let periodStart, periodEnd;
    if (recentPeriod === "day") {
      periodStart = now.toISOString().slice(0, 10);
    } else if (recentPeriod === "yesterday") {
      const y = new Date(now); y.setDate(y.getDate() - 1);
      periodStart = y.toISOString().slice(0, 10);
      periodEnd = periodStart;
    } else if (recentPeriod === "week") {
      const w = new Date(now); w.setDate(w.getDate() - 7);
      periodStart = w.toISOString().slice(0, 10);
    } else {
      const m = new Date(now); m.setDate(m.getDate() - 30);
      periodStart = m.toISOString().slice(0, 10);
    }
    const recentRows = data.filter(r => {
      const d = getDate(r);
      if (!d) return false;
      const ds = d.slice(0, 10);
      if (ds < periodStart) return false;
      if (periodEnd && ds > periodEnd) return false;
      return true;
    });
    const recentCount = recentRows.length;
    const breakdown = {};
    recentRows.forEach(r => {
      const trip = getTripBase(r) || "Unknown";
      breakdown[trip] = (breakdown[trip] || 0) + 1;
    });
    const tipLines = Object.entries(breakdown)
      .sort((a, b) => b[1] - a[1])
      .map(([t, n]) => `${t}: ${n}`)
      .join('\n');
    const periodLabel = recentPeriod === "day" ? "today" : recentPeriod === "yesterday" ? "yesterday" : recentPeriod === "week" ? "last 7 days" : "last 30 days";
    const scRecent = document.getElementById("sc-recent");
    scRecent.innerHTML = `<span data-tip="${(tipLines || "No data").replace(/"/g, '&quot;')}">${recentCount.toLocaleString()}</span>`;
    document.getElementById("sc-recent-sub").textContent = periodLabel;
  }

  // Count previous-year participants registered by this date last year
  const lyCard = document.getElementById("sc-lastyear").closest(".scorecard");
  if (filterYear === 2025) {
    lyCard.style.opacity = "0.35";
    lyCard.title = "No 2024 data available to compare against";
    document.getElementById("sc-lastyear").textContent = "—";
    document.getElementById("sc-lastyear-sub").textContent = "";
  } else {
    lyCard.style.opacity = "";
    lyCard.title = "";
    const todayDate = new Date();
    const cutoff25 = new Date(todayDate);
    cutoff25.setFullYear(cutoff25.getFullYear() - 1);
    const cutoffStr = cutoff25.toISOString().slice(0, 10);
    const lastYearCount = filteredAll().filter(r => {
      if (getTripYear(r) !== 2025) return false;
      const d = getDate(r);
      return d && d.slice(0, 10) <= cutoffStr;
    }).length;
    const diff = totalBooked - lastYearCount;
    const diffLabel = diff >= 0 ? "+" + diff.toLocaleString() + " ahead" : diff.toLocaleString() + " behind";
    animateValue(document.getElementById("sc-lastyear"), lastYearCount);
    document.getElementById("sc-lastyear-sub").textContent = diffLabel;
  }
}

function makeChart(canvasId, config) {
  if (charts[canvasId]) charts[canvasId].destroy();

function countBy(data, fn) {
  const m = {};
  for (const r of data) { const k = fn(r); if (k) m[k] = (m[k] || 0) + 1; }
  return m;
}

// ─── LEADS SECTION ────────────────────────────────────────────────
const LEAD_BRAND_MAP = {
  "TCT": ["The Canoe Trip Classic", "The Canoe Trip Short"],
  "CT": ["Canoe Tribe Classic", "Canoe Tribe Short"],
  "TKT": ["The Kayak Trip"],
  "PRT": ["The Packraft Trail Semoy", "The Packraft Trail Mullerthal", "The Packraft Trail Biesbosch", "The Packraft Trail Ardennes", "The Packraft Trail Bretagne", "The Packraft Trail Bavaria"],
  "PRTSLOV": ["The Packraft Trail Slovenia"],
  "FRIES": ["The Canoe Trip Friesland"],
};

function getFilteredLeads() {
  return leadsData.filter(r => {
    // Brand/trip filter
    const trips = LEAD_BRAND_MAP[r.brand] || [];
    if (filterTrips.size > 0 && !trips.some(t => filterTrips.has(t))) return false;
    if (filterGroup !== "all") {
      const groupTrips = TRIP_GROUPS[filterGroup];
      if (!groupTrips || !trips.some(t => groupTrips.includes(t))) return false;
    }
    // Language filter
    if (filterLang !== "all") {
      const lg = (r.language || "").toLowerCase();
      const mapped = lg === "nl" ? "NL" : lg === "fr" ? "FR" : lg === "de" ? "DE" : "EN";
      if (mapped !== filterLang) return false;
    }
    return true;
  });
}

function updateLeads() {
  const el = document.getElementById("leads-section");
  if (!el || !leadsData.length) { if (el) el.innerHTML = ""; return; }

  // Render collapsed shell
  if (leadsCollapsed) {

  }

  const leads = getFilteredLeads();
  const curYear = filterYear;

  // Extract year from typeform name (e.g. "TCT26_NL_PREREG" → 2026)
  function getLeadYear(r) {
    const m = (r.typeform || "").match(/(\d{2})/);
    return m ? 2000 + parseInt(m[1]) : null;
  }

  // Split by year based on typeform name, not submission date
  const curLeads = leads.filter(r => getLeadYear(r) === curYear);

  const totalCur = curLeads.length;

  const actionsCur = {};

// ─── CHART UPDATERS ────────────────────────────────────────────────
function updateTimeline(data) {
  const curYear = filterYear;
  const prevYear = getPrevYear();
  const tripFiltered = filteredAll();
  const yearShift = prevYear ? curYear - prevYear : 0;

  // Group registrations by trip-year
  const dailyCur = {}, dailyPrev = {};
  for (const r of tripFiltered) {
    const tripY = getTripYear(r);
    if (tripY !== curYear && tripY !== prevYear) continue;
    const d = getDate(r);
    if (!d) continue;
    const dt = new Date(d);
    if (isNaN(dt)) continue;
    const key = dt.toISOString().slice(0, 10);
    if (tripY === curYear) dailyCur[key] = (dailyCur[key] || 0) + 1;
    else dailyPrev[key] = (dailyPrev[key] || 0) + 1;
  }

  // Shift previous year forward to align on same x-axis
  const shiftedPrev = {};
  for (const [date, count] of Object.entries(dailyPrev)) {
    const dt = new Date(date);
    dt.setFullYear(dt.getFullYear() + yearShift);
    const key = dt.toISOString().slice(0, 10);
    shiftedPrev[key] = (shiftedPrev[key] || 0) + count;
  }

  const allDates = [...new Set([...Object.keys(shiftedPrev), ...Object.keys(dailyCur)])].sort();
  const today = new Date().toISOString().slice(0, 10);

  function buildCum(daily, cutoff) {
    const firstDate = Object.keys(daily).sort()[0];
    let cum = 0;
    return allDates.map(d => {
      if (d < firstDate) return null;
      if (cutoff && d > cutoff) return null;
      cum += (daily[d] || 0);
      return cum;
    });
  }

  const dataCur = buildCum(dailyCur, today);
  const dataPrev = buildCum(shiftedPrev, null);

  // ── Build projected estimation from 2025 curve ──
  let dataProjected = null;
  if (prevYear && curYear !== prevYear) {
    const prevTotal = dataPrev.filter(v => v != null).slice(-1)[0] || 0;
    const curTotal = dataCur.filter(v => v != null).slice(-1)[0] || 0;
    if (prevTotal > 0 && curTotal > 0) {
      const todayIdx = allDates.indexOf(today) >= 0 ? allDates.indexOf(today) : allDates.findIndex(d => d > today) - 1;
      const prevAtToday = todayIdx >= 0 && dataPrev[todayIdx] != null ? dataPrev[todayIdx] : prevTotal;

      // Use same method as pace tracker: projected = curTotal / (prevAtToday / prevTotal)
      const pct2025 = prevAtToday / prevTotal;
      const projectedTotal = Math.round(curTotal / pct2025);

      // Draw the curve from today to projectedTotal, following 2025's shape
      dataProjected = allDates.map((d, i) => {
        if (d < today) return null;
        if (dataPrev[i] == null) return null;
        // Normalize 2025 curve from todayIdx to end as 0→1, then map to curTotal→projectedTotal
        const prevRemaining = prevTotal - prevAtToday;
        if (prevRemaining <= 0) return curTotal;
        const progress = (dataPrev[i] - prevAtToday) / prevRemaining; // 0 at today, 1 at end
        return Math.round(curTotal + progress * (projectedTotal - curTotal));
      });
      // Connect to the last actual data point
      if (todayIdx >= 0) dataProjected[todayIdx] = curTotal;
    }
  }

  const labels = allDates.map(d => {
    const dt = new Date(d);
    return dt.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  });

  document.getElementById("timeline-title").textContent = prevYear
    ? `Total Bookers '${String(curYear).slice(-2)} vs '${String(prevYear).slice(-2)}`
    : `Total Bookers '${String(curYear).slice(-2)}`;

  const datasets = [
    { label: `TOTAL '${String(curYear).slice(-2)}`, data: dataCur, borderColor: "#8b5cf6", backgroundColor: "#8b5cf620", borderWidth: 2, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true, fill: true },
  ];
  if (dataProjected) datasets.push(
    { label: `Projected '${String(curYear).slice(-2)}`, data: dataProjected, borderColor: "#8b5cf6", borderWidth: 2, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true, borderDash: [6, 4], backgroundColor: "transparent" },
  );
  if (prevYear) datasets.push(
    { label: `TOTAL '${String(prevYear).slice(-2)}`, data: dataPrev, borderColor: "#c4b5fd", borderWidth: 2, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true },
  );

  makeChart("ch-timeline", {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: true, position: "top" } },
      scales: {
        x: { ticks: { maxTicksLimit: 10, maxRotation: 0 } },
        y: { beginAtZero: true },
      },
    },
  });
}

// Map brand shortnames to trip base names
const BRAND_TO_TRIPS = {
  "TCT": ["The Canoe Trip Classic", "The Canoe Trip Short"],
  "TKT": ["The Kayak Trip"],
  "PRT": ["The Packraft Trail Semoy", "The Packraft Trail Mullerthal", "The Packraft Trail Biesbosch", "The Packraft Trail Ardennes", "The Packraft Trail Bretagne", "The Packraft Trail Bavaria", "The Packraft Trail Balkan"],
  "CT": ["Canoe Tribe Classic", "Canoe Tribe Short"],
  "PRTSLOV": ["The Packraft Trail Slovenia"],
};

function getRelevantBrands() {
  // Determine which brands match the current trip/group filter
  if (filterTrips.size > 0) {
    return Object.entries(BRAND_TO_TRIPS)
      .filter(([, trips]) => trips.some(t => filterTrips.has(t)))
      .map(([brand]) => brand);
  }
  if (filterGroup !== "all") {
    const groupTrips = TRIP_GROUPS[filterGroup] || [];
    return Object.entries(BRAND_TO_TRIPS)
      .filter(([, trips]) => trips.some(t => groupTrips.includes(t)))
      .map(([brand]) => brand);
  }
  return Object.keys(BRAND_TO_TRIPS);
}

function updateWebVisits() {
  const el = document.getElementById("webvisits-section");
  if (!webVisits.length) { el.innerHTML = ""; return; }

  const curYear = filterYear;
  const prevYear = getPrevYear();
  const relevantBrands = new Set(getRelevantBrands());

  // Aggregate daily visits across relevant brands
  const dailyCur = {}, dailyPrev = {};
  for (const r of webVisits) {
    if (!relevantBrands.has(r.shortname)) continue;
    const d = (r.date || "").slice(0, 10);
    if (!d) continue;
    const y = parseInt(d.slice(0, 4));
    const val = parseInt(r.value) || 0;
    if (y === curYear) dailyCur[d] = (dailyCur[d] || 0) + val;
    else if (y === prevYear) dailyPrev[d] = (dailyPrev[d] || 0) + val;
  }

  if (Object.keys(dailyCur).length === 0 && Object.keys(dailyPrev).length === 0) {
    el.innerHTML = "";
    return;
  }

  const yearShift = prevYear ? curYear - prevYear : 0;

  // Shift previous year forward
  const shiftedPrev = {};
  if (prevYear) {
    for (const [date, count] of Object.entries(dailyPrev)) {
      const dt = new Date(date);
      dt.setFullYear(dt.getFullYear() + yearShift);
      const k = dt.toISOString().slice(0, 10);
      shiftedPrev[k] = (shiftedPrev[k] || 0) + count;
    }
  }

  // Weekly aggregation for cleaner chart
  function toWeekKey(dateStr) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() - d.getDay() + 1); // Monday
    return d.toISOString().slice(0, 10);
  }

  // Include future dates from prev year to show what's ahead
  const todayStr = new Date().toISOString().slice(0, 10);
  const allDays = [...new Set([...Object.keys(dailyCur), ...Object.keys(shiftedPrev)])].sort();

  const labels = allDays.map(d => new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" }));

  const curS = String(curYear).slice(-2);
  const prevS = prevYear ? String(prevYear).slice(-2) : "";

  // Total visits for scorecards
  const totalCur = Object.values(dailyCur).reduce((a, b) => a + b, 0);
  const totalPrev = prevYear ? Object.values(dailyPrev).reduce((a, b) => a + b, 0) : 0;

  const BRAND_NAMES = { TCT: "The Canoe Trip", TKT: "The Kayak Trip", PRT: "Packraft Trails", CT: "Canoe Tribe", PRTSLOV: "Packraft Slovenia" };
  const brandLabel = relevantBrands.size === Object.keys(BRAND_TO_TRIPS).length ? "All trips" :
    [...relevantBrands].map(b => BRAND_NAMES[b] || b).join(", ");

  el.innerHTML = `
    <div class="chart-card full-width" style="margin-bottom:24px">
      <h3 style="display:flex;justify-content:space-between;align-items:center;">
        <span>Website Visits (daily) — ${brandLabel}</span>
        <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">
          '${curS}: ${totalCur.toLocaleString()} visits${prevYear ? ` · '${prevS}: ${totalPrev.toLocaleString()} visits` : ""}
        </span>
      </h3>
      <div class="chart-wrapper line-h"><canvas id="ch-webvisits"></canvas></div>
    </div>`;

  const datasets = [
    { label: `Visits '${curS}`, data: allDays.map(d => d < todayStr ? (dailyCur[d] || 0) : null), borderColor: "#8b5cf6", backgroundColor: "#8b5cf620", borderWidth: 1.5, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: false, fill: true },
  ];
  if (prevYear) {
    // Solid line for past, dashed for future
    datasets.push(
      { label: `Visits '${prevS}`, data: allDays.map(d => d <= todayStr ? (shiftedPrev[d] ?? null) : null), borderColor: "#c4b5fd", borderWidth: 1.5, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true },
      { label: `'${prevS} forecast`, data: allDays.map(d => d >= todayStr ? (shiftedPrev[d] ?? null) : null), borderColor: "#c4b5fd", borderWidth: 1.5, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true, borderDash: [5, 5] },
    );
  }

  makeChart("ch-webvisits", {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: true, position: "top" } },
      scales: {
        x: { ticks: { maxTicksLimit: 15, maxRotation: 0 } },
        y: { beginAtZero: true },
      },
    },
  });
}

function updateSegmentCharts() {

    }

      else dailyPrev[key] = (dailyPrev[key] || 0) + 1;
    }

    const shiftedPrev = {};
    if (prevYear) {
      for (const [date, count] of Object.entries(dailyPrev)) {
        const dt = new Date(date);
        dt.setFullYear(dt.getFullYear() + yearShift);
        const k = dt.toISOString().slice(0, 10);
        shiftedPrev[k] = (shiftedPrev[k] || 0) + count;
      }
    }

    const allDates = [...new Set([...Object.keys(shiftedPrev), ...Object.keys(dailyCur)])].sort();

    function buildCum(daily, cutoff) {
      const firstDate = Object.keys(daily).sort()[0];

        if (d < firstDate) return null;

        cum += (daily[d] || 0);
        return cum;

          x: { ticks: { maxTicksLimit: 6, maxRotation: 0, font: { size: 10 } } },

  }
}

function updateWeekShort() {
  const today = new Date().toISOString().slice(0, 10);
  const card = document.getElementById("card-weekshort");
  const pieCard = document.getElementById("card-weekshort-pie");

  // Only show when viewing canoe trip(s) — group or individual
  const weekShortTrips = new Set([
    "The Canoe Trip Classic", "The Canoe Trip Short",
    "Canoe Tribe Classic", "Canoe Tribe Short",
  ]);
  const weekShortGroups = new Set(["The Canoe Trip", "Canoe Tribe"]);
  const showWeekShort = weekShortGroups.has(filterGroup)
    || [...filterTrips].some(t => weekShortTrips.has(t));
  if (!showWeekShort) {
    if (card) card.style.display = "none";
    if (pieCard) pieCard.style.display = "none";
    return;
  }

  const curYear = filterYear;
  const prevYear = getPrevYear();
  const yearShift = prevYear ? curYear - prevYear : 0;
  const curS = String(curYear).slice(-2);
  const prevS = prevYear ? String(prevYear).slice(-2) : "";

  // Determine which sibling trips to include — if a specific sub-trip is selected,
  // still include all siblings so the pie chart shows the full Week vs Short picture
  let relevantTrips = weekShortTrips;
  if (filterTrips.size > 0) {
    const selectedWeekShort = [...filterTrips].filter(t => weekShortTrips.has(t));
    if (selectedWeekShort.length > 0) {
      // Find the parent group and include all its members
      for (const [group, members] of Object.entries(TRIP_GROUPS)) {
        if (members.some(m => selectedWeekShort.includes(m))) {
          relevantTrips = new Set(members.filter(t => weekShortTrips.has(t)));
          break;
        }
      }
    }
  }
  // Bypass trip filter — use lang filter only, then filter by relevant trips
  const tripFiltered = allData.filter(r => getPrice(r) > 0 && passesLangFilter(r) && relevantTrips.has(getTripBase(r)));
  const types = { Week: { cur: {}, prev: {} }, Short: { cur: {}, prev: {} } };
  for (const r of tripFiltered) {
    const tripY = getTripYear(r);
    if (tripY !== curYear && tripY !== prevYear) continue;
    const d = getDate(r);
    if (!d) continue;
    const key = new Date(d).toISOString().slice(0, 10);
    const type = getTripType(r);
    const bucket = tripY === curYear ? "cur" : "prev";
    types[type][bucket][key] = (types[type][bucket][key] || 0) + 1;
  }

  const shortTotalCur = Object.values(types.Short.cur).reduce((a, b) => a + b, 0);
  if (shortTotalCur < 5) {
    if (card) card.style.display = "none";
    return;
  }
  if (card) card.style.display = "";

  function shift(daily) {
    const s = {};
    for (const [date, count] of Object.entries(daily)) {
      const dt = new Date(date);
      dt.setFullYear(dt.getFullYear() + yearShift);
      const k = dt.toISOString().slice(0, 10);
      s[k] = (s[k] || 0) + count;
    }
    return s;
  }
  const weekShiftedPrev = prevYear ? shift(types.Week.prev) : {};
  const shortShiftedPrev = prevYear ? shift(types.Short.prev) : {};

  const allDates = [...new Set([
    ...Object.keys(weekShiftedPrev), ...Object.keys(types.Week.cur),
    ...Object.keys(shortShiftedPrev), ...Object.keys(types.Short.cur),
  ])].sort();

  function buildCum(daily, cutoff) {
    const firstDate = Object.keys(daily).sort()[0];
    let cum = 0;
    return allDates.map(d => {
      if (!firstDate || d < firstDate) return null;
      if (cutoff && d > cutoff) return null;
      cum += (daily[d] || 0);
      return cum;
    });
  }

  const labels = allDates.map(d => new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" }));

  const datasets = [
    { label: "Week " + curS, data: buildCum(types.Week.cur, today), borderColor: "#2563eb", borderWidth: 2, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true },
    { label: "Short " + curS, data: buildCum(types.Short.cur, today), borderColor: "#dc2626", borderWidth: 2, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true },
  ];
  if (prevYear) {
    datasets.push(
      { label: "Week " + prevS, data: buildCum(weekShiftedPrev, null), borderColor: "#93c5fd", borderWidth: 2, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true },
      { label: "Short " + prevS, data: buildCum(shortShiftedPrev, null), borderColor: "#fca5a5", borderWidth: 2, tension: 0.3, pointRadius: 0, pointHitRadius: 20, spanGaps: true },
    );
  }

  document.getElementById("weekshort-title").textContent = prevYear
    ? `Week & Short '${curS} vs '${prevS}`
    : `Week & Short '${curS}`;
  document.getElementById("weekshort-pie-title").textContent = `Week vs Short '${curS}`;

  makeChart("ch-weekshort", {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: true, position: "top", labels: { boxWidth: 12, font: { size: 10 } } } },
      scales: {
        x: { ticks: { maxTicksLimit: 6, maxRotation: 0, font: { size: 10 } } },
        y: { beginAtZero: true },
      },
    },
  });

  // Doughnut: Week vs Short for current year
  const weekTotalCur = Object.values(types.Week.cur).reduce((a, b) => a + b, 0);
  if (pieCard) pieCard.style.display = shortTotalCur < 5 ? "none" : "";
  if (shortTotalCur >= 5) {
    makeChart("ch-weekshort-pie", {
      type: "doughnut",
      data: {
        labels: ["Week", "Short"],
        datasets: [{
          data: [weekTotalCur, shortTotalCur],
          backgroundColor: ["#2563eb", "#dc2626"],
          borderWidth: 2,
          borderColor: getComputedStyle(document.documentElement).getPropertyValue("--bg-card").trim(),
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        cutout: "55%",
        plugins: {
          legend: { display: true, position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw} (${Math.round(ctx.raw / (weekTotalCur + shortTotalCur) * 100)}%)` } },
        },
      },
    });
  }
}

function getAge(row) {
  const bd = row.birthdate;
  if (!bd) return null;
  const birth = new Date(bd);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
  return age >= 0 && age < 120 ? age : null;
}

function updateAge(data) {
  const brackets = { "0–17": 0, "18–24": 0, "25–34": 0, "35–44": 0, "45–54": 0, "55–64": 0, "65+": 0 };
  for (const r of data) {
    const age = getAge(r);
    if (age === null) continue;
    if (age < 18) brackets["0–17"]++;
    else if (age < 25) brackets["18–24"]++;
    else if (age < 35) brackets["25–34"]++;
    else if (age < 45) brackets["35–44"]++;
    else if (age < 55) brackets["45–54"]++;
    else if (age < 65) brackets["55–64"]++;
    else brackets["65+"]++;
  }

  makeChart("ch-age", {
    type: "bar",
    data: {
      labels: Object.keys(brackets),
      datasets: [{ data: Object.values(brackets), backgroundColor: COLORS.slice(0, 7), borderRadius: 6 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true } },
    },
  });
}

function updateAgeByTrip(data) {
  const el = document.getElementById("card-age-trip");
  if (el) el.style.display = filterTrips.size === 1 ? "none" : "";
  const trips = {};
  for (const r of data) {
    const age = getAge(r);
    if (age === null) continue;
    const base = getTripBase(r);
    if (!trips[base]) trips[base] = { sum: 0, count: 0 };
    trips[base].sum += age;
    trips[base].count++;
  }
  const entries = Object.entries(trips)
    .map(([name, v]) => [name, Math.round(v.sum / v.count)])
    .sort((a, b) => b[1] - a[1]);

  makeChart("ch-age-trip", {
    type: "bar",
    data: {
      labels: entries.map(e => e[0]),
      datasets: [{ data: entries.map(e => e[1]), backgroundColor: COLORS.slice(0, entries.length), borderRadius: 6 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: "y",
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.raw + " years" } } },
      scales: { x: { beginAtZero: true, title: { display: true, text: "Avg age" } } },
    },
  });
}

function updateGender() {
  const el = document.getElementById("card-gender");
  if (!el) return;
  const curYear = filterYear;
  const counts = {};

  for (const [pid] of Object.entries(DETAIL_APIS)) {
    const rows = detailData[pid];
    if (!rows || !rows.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info || info.year !== curYear) continue;

    for (const r of rows) {
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }
      const g = (r.gender || "").trim().toLowerCase();
      let label;
      if (g === "m" || g === "male" || g === "man" || g === "homme") label = "Male";
      else if (g === "f" || g === "female" || g === "woman" || g === "femme" || g === "vrouw") label = "Female";
      else if (g === "x" || g === "non-binary" || g === "other") label = "Other";
      else label = "Unknown";
      counts[label] = (counts[label] || 0) + 1;
    }
  }

  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) { el.style.display = "none"; return; }
  el.style.display = "";
  const total = entries.reduce((s, e) => s + e[1], 0);
  el.querySelector("h3").textContent = `Gender Distribution (${total})`;

  const genderColors = { Male: "#60a5fa", Female: "#f472b6", Other: "#a78bfa", Unknown: "#94a3b8" };
  makeChart("ch-gender", {
    type: "doughnut",
    data: {
      labels: entries.map(e => e[0]),
      datasets: [{ data: entries.map(e => e[1]), backgroundColor: entries.map(e => genderColors[e[0]] || "#94a3b8") }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
    },
  });
}

// ─── AVERAGE TEAM SIZE ────────────────────────────────────────────
function updateTeamSize() {
  const old = document.getElementById("teamsize-card-inner");
  if (old) old.remove();
  const curYear = filterYear;
  let totalSize = 0, teamCount = 0;
  const seenTeams = new Set();

  for (const [pid] of Object.entries(DETAIL_APIS)) {
    const rows = detailData[pid];
    if (!rows || !rows.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info || info.year !== curYear) continue;

    for (const r of rows) {
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }
      if (!r.team_id) continue;
      const teamKey = `${pid}_${r.team_id}`;
      if (seenTeams.has(teamKey)) continue;
      seenTeams.add(teamKey);
      const size = parseInt(r.team_size);
      if (size && size > 0) { totalSize += size; teamCount++; }
    }
  }

  if (teamCount === 0) return;
  const avg = (totalSize / teamCount).toFixed(1);
  const card = document.createElement("div");
  card.id = "teamsize-card-inner";
  card.className = "scorecard";
  card.style.borderLeftColor = "#a78bfa";
  card.innerHTML = `
    <div class="scorecard-label">Avg. Team Size</div>
    <div class="scorecard-value">${avg}</div>
    <div class="scorecard-sub">${teamCount.toLocaleString()} teams</div>`;
  document.getElementById("scorecards-secondary").appendChild(card);
}

// ─── TEAM SIZE DISTRIBUTION ───────────────────────────────────────
function updateTeamDist() {
  const el = document.getElementById("card-teamdist");
  if (!el) return;

  const curYear = filterYear;
  const sizeCounts = {};

  for (const [pid] of Object.entries(DETAIL_APIS)) {
    const rows = detailData[pid];
    if (!rows || !rows.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info || info.year !== curYear) continue;

    const seenTeams = new Set();
    for (const r of rows) {
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }

      const teamKey = r.team_id ? `${pid}_${r.team_id}` : `solo_${pid}_${r.id}`;
      if (seenTeams.has(teamKey)) continue;
      seenTeams.add(teamKey);

      const size = r.team_id ? parseInt(r.team_size) || 1 : 1;
      sizeCounts[size] = (sizeCounts[size] || 0) + 1;
    }
  }

  const allSizes = Object.keys(sizeCounts).map(Number).sort((a, b) => a - b);
  if (allSizes.length === 0) { el.style.display = "none"; return; }
  el.style.display = "";

  // Bucket sizes 1-9 individually, 10+ combined
  const buckets = {};
  let tenPlus = 0;
  const tenPlusDetail = {};
  for (const s of allSizes) {
    if (s < 10) {
      buckets[s] = sizeCounts[s];
    } else {
      tenPlus += sizeCounts[s];
      tenPlusDetail[s] = sizeCounts[s];
    }
  }

  const labels = [];
  const data = [];
  for (let s = 1; s <= 9; s++) {
    if (buckets[s]) {
      labels.push(s === 1 ? "Solo" : `${s}`);
      data.push(buckets[s]);
    }
  }
  if (tenPlus > 0) {
    labels.push("10+");
    data.push(tenPlus);
  }

  // Build 10+ tooltip text for hover
  const tenPlusLines = Object.entries(tenPlusDetail)
    .sort((a, b) => Number(a[0]) - Number(b[0]))
    .map(([s, c]) => `Size ${s}: ${c}`).join("\n");

  makeChart("ch-teamdist", {
    type: "bar",
    data: {
      labels,
      datasets: [{ data, backgroundColor: "#8b5cf6", borderRadius: 6 }],
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.label === "10+" && tenPlusLines) return tenPlusLines.split("\n");
              return `${ctx.parsed.y} teams`;
            },
          },
        },
      },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, ticks: { precision: 0 } },
      },
    },
  });
}

// ─── REVIEW SCORES ────────────────────────────────────────────────
function updateReviews() {
  const el = document.getElementById("card-reviews");
  if (!el) return;
  if (filterYear === 2026) { el.style.display = "none"; return; }
  const fields = [
    { key: "score", label: "Overall" },
    { key: "communication_before", label: "Comms Before" },
    { key: "communication_during", label: "Comms During" },
    { key: "recommend_to_friends", label: "Recommend" },
    { key: "travel_again", label: "Travel Again" },
  ];
  const sums = {}, cnts = {};
  fields.forEach(f => { sums[f.key] = 0; cnts[f.key] = 0; });
  let reviewYear = null;

  for (const [pid] of Object.entries(DETAIL_APIS)) {
    const rows = detailData[pid];
    if (!rows || !rows.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info) continue;

    for (const r of rows) {
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }
      const textMap = { definitely_yes: 5, probably_yes: 4, maybe: 3, not_sure: 3, probably_no: 2, definitely_no: 1, yes: 5, no: 1 };
      for (const f of fields) {
        const raw = r[f.key];
        const v = textMap[String(raw).toLowerCase().trim()] ?? parseFloat(raw);
        if (!isNaN(v) && v > 0) { sums[f.key] += v; cnts[f.key]++; if (!reviewYear) reviewYear = info.year; }
      }
    }
  }

  const hasData = fields.some(f => cnts[f.key] > 0);
  if (!hasData) { el.style.display = "none"; return; }
  el.style.display = "";
  const responseCount = Math.max(...fields.map(f => cnts[f.key]));
  const yearNote = reviewYear ? ` '${String(reviewYear).slice(-2)}` : "";
  el.querySelector("h3").textContent = `Review Scores${yearNote} (${responseCount} responses)`;

  const labels = fields.map(f => f.label);
  const avgData = fields.map(f => cnts[f.key] > 0 ? parseFloat((sums[f.key] / cnts[f.key]).toFixed(1)) : 0);
  const maxScore = Math.max(...avgData) <= 5 ? 5 : 10;

  makeChart("ch-reviews", {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data: avgData,
        backgroundColor: avgData.map(v => {
          const pct = v / maxScore;
          return pct >= 0.8 ? "#22c55e" : pct >= 0.6 ? "#eab308" : "#ef4444";
        }),
        borderRadius: 6,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: "y",
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ctx.raw + " / " + maxScore } },
      },
      scales: { x: { beginAtZero: true, max: maxScore, ticks: { stepSize: maxScore === 5 ? 1 : 2 } } },
    },
  });
}

function updateYoY() {
  const curYear = filterYear;
  const prevYear = getPrevYear();
  const src = filteredAll();
  const byTourYear = {};
  for (const r of src) {
    const base = getTripBase(r);
    const tripY = getTripYear(r);
    if (tripY !== curYear && tripY !== prevYear) continue;
    if (!byTourYear[base]) byTourYear[base] = {};
    byTourYear[base][tripY] = (byTourYear[base][tripY] || 0) + 1;
  }
  const tours = Object.keys(byTourYear).sort((a, b) => {
    const sumA = (byTourYear[a][curYear] || 0) + (byTourYear[a][prevYear] || 0);
    const sumB = (byTourYear[b][curYear] || 0) + (byTourYear[b][prevYear] || 0);
    return sumB - sumA;
  });

  const titleEl = document.getElementById("yoy-title");
  if (titleEl) titleEl.textContent = prevYear ? `${prevYear} vs ${curYear} Comparison` : `${curYear} by Trip`;

  const datasets = [];
  if (prevYear) datasets.push(
    { label: String(prevYear), data: tours.map(t => byTourYear[t][prevYear] || 0), backgroundColor: COLORS[0] + "cc", borderRadius: 4 },
  );
  datasets.push(
    { label: String(curYear), data: tours.map(t => byTourYear[t][curYear] || 0), backgroundColor: COLORS[1] + "cc", borderRadius: 4 },
  );

  makeChart("ch-yoy", {
    type: "bar",
    data: { labels: tours, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: true, position: "top" } },
      scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true } },
    },
  });
}

function updateRevenue(data) {
  // Team-aware total revenue from detail APIs
  const m = {};
  const hasDetail = new Set();

  for (const [pid, rows] of Object.entries(detailData)) {
    if (!rows?.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info || info.year !== filterYear) continue;

    const teams = {};
    const solos = [];

    for (const r of rows) {
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }

      hasDetail.add(base);
      const basePrice = parseFloat(r.trip_base_price) || 0;
      const totalPrice = parseFloat(r.total_price) || 0;

      if (r.team_id) {
        const tk = `${pid}_${r.team_id}`;
        if (!teams[tk]) teams[tk] = { members: [], headTotal: 0, base };
        teams[tk].members.push({ basePrice });
        if (totalPrice > 0) teams[tk].headTotal = totalPrice;
      } else {
        solos.push({ basePrice, totalPrice, base });
      }
    }

    for (const team of Object.values(teams)) {
      if (!m[team.base]) m[team.base] = 0;
      const teamBase = team.members.reduce((s, x) => s + x.basePrice, 0);
      m[team.base] += team.headTotal || teamBase;
    }
    for (const s of solos) {
      if (!m[s.base]) m[s.base] = 0;
      m[s.base] += s.totalPrice || s.basePrice;
    }
  }

  // Fallback to base price for trips without detail API
  for (const r of data) {
    const key = getTripBase(r);
    if (hasDetail.has(key)) continue;
    m[key] = (m[key] || 0) + getPrice(r);
  }

  const entries = Object.entries(m).sort((a, b) => b[1] - a[1]);
  const colors = entries.map(([name]) => (TRIP_COLORS && TRIP_COLORS[name]) || COLORS[entries.indexOf(entries.find(e => e[0] === name)) % COLORS.length]);

  makeChart("ch-revenue", {
    type: "bar",
    data: {
      labels: entries.map(e => e[0]),
      datasets: [{ data: entries.map(e => e[1]), backgroundColor: colors, borderRadius: 6 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: "y",
      scales: { x: { beginAtZero: true, ticks: { callback: v => "€" + (v / 1000).toFixed(0) + "k" } } },
      plugins: { tooltip: { callbacks: { label: ctx => "€" + Number(ctx.raw).toLocaleString() } } },
    },
  });
}

// ─── TABLE ─────────────────────────────────────────────────────────
let tableLimit = 15;
function updateTable(data) {
  const allSorted = [...data]
    .filter(r => getDate(r))
    .sort((a, b) => new Date(getDate(b)) - new Date(getDate(a)));
  const sorted = allSorted.slice(0, tableLimit);
  const hasMore = allSorted.length > tableLimit;

  // Build team lookup: pid_firstname_lastname → team key
  const teamKeyMap = {};
  for (const [pid, rows] of Object.entries(detailData)) {
    if (!rows) continue;
    for (const dr of rows) {
      const k = `${pid}_${(dr.firstname||"").toLowerCase()}_${(dr.lastname||"").toLowerCase()}`;
      teamKeyMap[k] = dr.team_id ? `${pid}_${dr.team_id}` : null;
    }
  }

  // Assign group index per team key
  const teamGroupIndex = {};
  let groupCounter = 0;
  for (const r of sorted) {
    const k = `${r.project_id}_${(getFirst(r)||"").toLowerCase()}_${(getLast(r)||"").toLowerCase()}`;
    const tk = teamKeyMap[k] || k;
    if (!(tk in teamGroupIndex)) teamGroupIndex[tk] = groupCounter++;
  }

  // Re-sort: group team members together, head booker (earliest date) first within each group
  const groupedSorted = [...sorted].sort((a, b) => {
    const ka = `${a.project_id}_${(getFirst(a)||"").toLowerCase()}_${(getLast(a)||"").toLowerCase()}`;
    const kb = `${b.project_id}_${(getFirst(b)||"").toLowerCase()}_${(getLast(b)||"").toLowerCase()}`;
    const ga = teamGroupIndex[teamKeyMap[ka] || ka];
    const gb = teamGroupIndex[teamKeyMap[kb] || kb];
    if (ga !== gb) return ga - gb;
    return new Date(getDate(a)) - new Date(getDate(b));
  });

  document.getElementById("table-section").innerHTML = `
    <div class="table-card ${tableCollapsed ? "collapsed" : ""}" id="registrations-card">
      <h3 onclick="tableCollapsed=!tableCollapsed;document.getElementById('registrations-card').classList.toggle('collapsed')">Most Recent Registrations</h3>
      <div class="table-body">
        <table>
          <thead><tr><th>Name</th><th>Trip</th><th>Tour</th><th>Country</th><th>Registered</th><th>Base Price</th><th>Total Price</th></tr></thead>
          <tbody>
            ${groupedSorted.map(r => {
              const pid = r.project_id;
              const nameK = `${pid}_${(getFirst(r)||"").toLowerCase()}_${(getLast(r)||"").toLowerCase()}`;
              const tk = teamKeyMap[nameK] || nameK;
              const groupIdx = teamGroupIndex[tk];
              const shade = "";
              const dr = (detailData[pid] || []).find(d =>
                (d.firstname||"").toLowerCase() === (getFirst(r)||"").toLowerCase() &&
                (d.lastname||"").toLowerCase() === (getLast(r)||"").toLowerCase()
              );
              const base = (dr && dr.trip_base_price != null) ? parseFloat(dr.trip_base_price) || getPrice(r) : getPrice(r);
              const total = dr ? parseFloat(dr.total_price) || null : null;
              const api = DETAIL_APIS[pid];
              const falsy = new Set(["","0","0.0","0.00","no","nee","nein","non","false","n","nvt","n/a","na"]);
              const falsyPfx = ["no ","geen ","pas ","kein ","keine ","without "];
              const isFalsy = v => { if (v == null) return true; const s = String(v).toLowerCase().trim(); return falsy.has(s) || falsyPfx.some(p => s.startsWith(p)); };
              const upsells = (api?.upsells && dr)
                ? api.upsells.filter(u => !isFalsy(dr[u.field]))
                : [];
              const extras = total != null ? total - base : 0;
              const tipLines = total != null ? [
                `Base: €${base.toLocaleString()}`,
                ...upsells.map(u => `${u.label}: ${dr[u.field]}`),
                ...(extras > 0 ? [`Extras total: €${Math.round(extras).toLocaleString()}`] : [])
              ] : [];
              return `<tr style="${shade}">
                <td>${getFirst(r) || "—"} ${getLast(r)}</td>
                <td><span class="trip-badge">${getTripLabel(r)}</span></td>
                <td>${getTourName(r) || "—"}</td>
                <td>${getCountry(r) || "—"}</td>
                <td>${getDate(r) ? new Date(getDate(r)).toLocaleDateString() : "—"}</td>
                <td>€${base.toLocaleString()}</td>
                <td ${tipLines.length ? `data-tip="${tipLines.join('\n')}"` : ""}>${total != null ? "€" + total.toLocaleString() : ""}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
        ${hasMore ? `<div style="text-align:center;padding:12px 0;">
          <button onclick="tableLimit+=10;updateTable(filtered())" style="background:none;border:1px solid var(--text-muted);color:var(--text-muted);padding:6px 20px;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--text-muted)';this.style.color='var(--text-muted)'">Show 10 more</button>
        </div>` : ""}
      </div>
    </div>
  `;
}

// ─── BOOKING STATUS ────────────────────────────────────────────────
function updateBookingStatus() {
  const today = new Date().toISOString().slice(0, 10);
  const all = filteredAll();

  // Get all available years sorted descending
  const availableYears = [...new Set(all.map(getTripYear).filter(Boolean))].sort((a, b) => b - a);
  // Current year = selected filter year; previous year = the one before it in available data
  const currentYear = filterYear;
  const prevYear = availableYears.find(y => y < currentYear) || null;

  // Cutoff for previous year: same relative date shifted back
  const cutoffPrev = new Date();
  cutoffPrev.setFullYear(cutoffPrev.getFullYear() - (currentYear - (prevYear || currentYear)));
  const cutoffPrevStr = cutoffPrev.toISOString().slice(0, 10);

  const dataCurrent = all.filter(r => {
    if (getTripYear(r) !== currentYear) return false;
    const d = getDate(r);
    return d && d.slice(0, 10) <= today;
  });

  const dataPrev = prevYear ? all.filter(r => {
    if (getTripYear(r) !== prevYear) return false;
    const d = getDate(r);
    return d && d.slice(0, 10) <= cutoffPrevStr;
  }) : [];

  // Count per segment
  const countCurrent = {}, countPrev = {};
  for (const s of SEGMENTS) { countCurrent[s] = 0; countPrev[s] = 0; }
  for (const r of dataCurrent) countCurrent[getSegment(r)]++;
  for (const r of dataPrev) countPrev[getSegment(r)]++;
  const totalCurrent = dataCurrent.length, totalPrev = dataPrev.length;

  function yoyCell(vCur, vPrev) {
    if (vPrev === 0) return `<td>—</td>`;
    const pct = Math.round(((vCur - vPrev) / vPrev) * 100);
    const cls = pct >= 0 ? "yoy-pos" : "yoy-neg";
    return `<td class="${cls}">${pct >= 0 ? "+" : ""}${pct}%</td>`;
  }

  // Only show segments that have data in either year
  const activeSegs = SEGMENTS.filter(s => countCurrent[s] > 0 || countPrev[s] > 0);
  const segHeaders = activeSegs.map(s => `<th><span class="seg-dot" style="background:${SEG_COLORS[s]}"></span>${s}</th>`).join("");
  const segCur = activeSegs.map(s => `<td>${countCurrent[s]}</td>`).join("");
  const segCurPct = activeSegs.map(s => `<td>${totalCurrent ? Math.round(countCurrent[s] / totalCurrent * 100) : 0}%</td>`).join("");
  const segPrev = activeSegs.map(s => `<td>${countPrev[s]}</td>`).join("");
  const segPrevPct = activeSegs.map(s => `<td>${totalPrev ? Math.round(countPrev[s] / totalPrev * 100) : 0}%</td>`).join("");
  const segYoy = activeSegs.map(s => yoyCell(countCurrent[s], countPrev[s])).join("");

  const prevRows = prevYear ? `
          <tr><td class="row-label">${prevYear}</td>${segPrev}<td><strong>${totalPrev.toLocaleString()}</strong></td></tr>
          <tr class="pct-row"><td></td>${segPrevPct}<td></td></tr>
          <tr class="yoy-row"><td class="row-label">YoY</td>${segYoy}${yoyCell(totalCurrent, totalPrev)}</tr>` : "";

  document.getElementById("booking-status").innerHTML = `
    <div class="status-card">
      <h3>Booking Status — ${currentYear}</h3>
      <table class="status-table">
        <thead><tr><th></th>${segHeaders}<th>Total</th></tr></thead>
        <tbody>
          <tr><td class="row-label">${currentYear}</td>${segCur}<td><strong>${totalCurrent.toLocaleString()}</strong></td></tr>
          <tr class="pct-row"><td></td>${segCurPct}<td></td></tr>
          ${prevRows}
        </tbody>
      </table>
    </div>`;
}

// ─── TRANSPORT ─────────────────────────────────────────────────────
function getTransportData() {
  // Collect transport values from detail APIs for currently filtered trips
  const results = { cur: {}, prev: {} };
  const curYear = filterYear;
  const prevYear = getPrevYear();

  for (const [pid, api] of Object.entries(DETAIL_APIS)) {
    const rows = detailData[pid];
    if (!rows || !rows.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info) continue;
    const tripY = info.year;
    if (tripY !== curYear && tripY !== prevYear) continue;

    // Check if this project's trips pass the current filter
    // We need to check per-row since Canoe Trip splits into Classic/Short
    const field = api.transportField;
    for (const r of rows) {
      // Build a minimal row that getTripBase can work with
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }

      let transport = (r[field] || "").trim().toLowerCase();
      if (!transport) continue;
      // Normalize transport values
      if (transport === "no flights" || transport === "no flight") transport = "no flights";
      else if (transport.startsWith("flight") || transport.startsWith("flights") || ["bru", "cdg", "ams", "fra"].includes(transport)) transport = "flights";
      else if (transport.startsWith("bus")) transport = "bus";
      else if (transport.startsWith("selfdrive")) transport = "selfdrive";
      else if (transport.includes("shuttle")) transport = "shuttle";
      const bucket = tripY === curYear ? results.cur : results.prev;
      bucket[transport] = (bucket[transport] || 0) + 1;
    }
  }
  return results;
}

function updateTransport() {
  const el = document.getElementById("transport-section");
  if (filterTrips.size === 0 && filterGroup === "all") { el.innerHTML = ""; return; }
  const data = getTransportData();
  const curYear = filterYear;
  const prevYear = getPrevYear();
  const curEntries = Object.entries(data.cur).sort((a, b) => b[1] - a[1]);

  if (curEntries.length === 0) {
    el.innerHTML = "";
    return;
  }

  const prevEntries = Object.entries(data.prev);
  const hasPrev = prevEntries.length > 0;
  const totalCur = curEntries.reduce((s, [, v]) => s + v, 0);
  const totalPrev = hasPrev ? prevEntries.reduce((s, [, v]) => s + v, 0) : 0;

  // All unique transport types
  const allTypes = [...new Set([...curEntries.map(e => e[0]), ...prevEntries.map(e => e[0])])];
  // Sort by current year count descending
  allTypes.sort((a, b) => (data.cur[b] || 0) - (data.cur[a] || 0));

  const curS = String(curYear).slice(-2);
  const prevS = prevYear ? String(prevYear).slice(-2) : "";

  const datasets = [
    { label: `'${curS}`, data: allTypes.map(t => data.cur[t] || 0), backgroundColor: "#60a5fa", borderRadius: 6 },
  ];
  if (hasPrev) datasets.push(
    { label: `'${prevS}`, data: allTypes.map(t => data.prev[t] || 0), backgroundColor: "#c4b5fd", borderRadius: 6 },
  );

  el.innerHTML = `
    <div class="chart-card" style="margin-bottom: 24px;">
      <h3>Transport — ${curEntries.length} options${hasPrev ? ` (${totalCur} vs ${totalPrev} last year)` : ` (${totalCur} total)`}</h3>
      <div class="chart-wrapper bar-h"><canvas id="ch-transport-bar"></canvas></div>
    </div>`;

  makeChart("ch-transport-bar", {
    type: "bar",
    data: { labels: allTypes, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: "y",
      plugins: { legend: { display: hasPrev, position: "top" } },
      scales: { x: { beginAtZero: true } },
    },
  });

}
