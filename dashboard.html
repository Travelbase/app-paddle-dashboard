function getFilteredDetailRows(pid) {
  return (detailData[pid] || []).filter(r => {
    const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
    const base = getTripBase(fakeRow);
    if (!passesTripFilter(base)) return false;
    if (filterLang !== "all") {
      const lang = (r.language || "").toLowerCase();
      const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
      if (lg !== filterLang) return false;
    }
    return true;
  });
}

function updateReferrals() {
  const el = document.getElementById("card-referrals");
  if (!el) return;
  const curYear = filterYear;
  const prevYear = getPrevYear();

  const curCounts = {}, prevCounts = {};
  for (const [pid, rows] of Object.entries(detailData)) {
    if (!rows?.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info) continue;
    const tripY = info.year;
    if (tripY !== curYear && tripY !== prevYear) continue;

    for (const r of rows) {
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }
      const src = (r.introduced_by || "").toLowerCase().trim();
      if (!src) continue;
      const bucket = tripY === curYear ? curCounts : prevCounts;
      bucket[src] = (bucket[src] || 0) + 1;
    }
  }

  const curEntries = Object.entries(curCounts).sort((a, b) => b[1] - a[1]);
  if (curEntries.length === 0) { el.style.display = "none"; return; }
  el.style.display = "";

  const allSources = [...new Set([...Object.keys(curCounts), ...Object.keys(prevCounts)])];
  allSources.sort((a, b) => (curCounts[b] || 0) - (curCounts[a] || 0));

  const labels = allSources.map(s => s.charAt(0).toUpperCase() + s.slice(1));
  const curS = String(curYear).slice(-2);
  const prevS = prevYear ? String(prevYear).slice(-2) : "";
  const hasPrev = Object.keys(prevCounts).length > 0;

  const datasets = [
    { label: `'${curS}`, data: allSources.map(s => curCounts[s] || 0), backgroundColor: "#8b5cf6", borderRadius: 6 },
  ];
  if (hasPrev) datasets.push(
    { label: `'${prevS}`, data: allSources.map(s => prevCounts[s] || 0), backgroundColor: "#c4b5fd", borderRadius: 6 },
  );

  makeChart("ch-referrals", {
    type: "bar",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: "y",
      plugins: { legend: { display: hasPrev, position: "top" } },
      scales: { x: { beginAtZero: true } },
    },
  });
}

function updateDetailCards() {
  const container = document.getElementById("detail-cards");

  // Find config for currently selected trip(s)
  let config = null;
  if (filterTrips.size === 1) {
    config = DETAIL_CARDS[[...filterTrips][0]];
  }
  if (!config) { container.innerHTML = ""; return; }

  const curYear = filterYear;
  const prevYear = getPrevYear();
  const curPid = config.pids[curYear];
  const prevPid = prevYear ? config.pids[prevYear] : null;
  if (!curPid) { container.innerHTML = ""; return; }

  const curRows = getFilteredDetailRows(curPid);
  const prevRows = prevPid ? getFilteredDetailRows(prevPid) : [];
  const cardDefs = CARD_DEFS[config.cards];
  if (!cardDefs || curRows.length === 0) { container.innerHTML = ""; return; }

  const prevY = prevYear || (curYear - 1);
  let html = "";

  for (const card of cardDefs) {
    const curField = card.fields[curYear] || card.fields[2026] || Object.values(card.fields)[0];
    const prevField = prevPid ? (card.fields[prevYear] || card.fields[2025] || curField) : null;

    const getF = (obj, yr) => obj ? (obj[yr] || obj[2026] || obj[2025] || Object.values(obj)[0]) : null;
    const curField2 = getF(card.field2, curYear);
    const prevField2 = card.field2 && prevPid ? getF(card.field2, prevYear) : null;
    const curField3 = getF(card.field3, curYear);
    const prevField3 = card.field3 && prevPid ? getF(card.field3, prevYear) : null;
    const hasFieldIdx = card.items.some(it => it.fieldIdx !== undefined);

    const countItems = (rows, field, field2, field3) => {
      const counts = card.items.map(() => 0);
      if (hasFieldIdx) {
        const fields = [field, field2, field3];
        for (const r of rows) {
          for (let i = 0; i < card.items.length; i++) {
            const f = fields[card.items[i].fieldIdx] || field;
            const v = (r[f] || "").toLowerCase().trim();
            if (v && card.items[i].test && card.items[i].test(v)) counts[i]++;
          }
        }
      } else {
        // Standard single-field card
        for (const r of rows) {
          const v = (r[field] || "").toLowerCase().trim();
          if (!v) { const ni = card.items.findIndex(i => i.none); if (ni >= 0) counts[ni]++; continue; }
          let matched = false;
          for (let i = 0; i < card.items.length; i++) {
            if (card.items[i].none) continue;
            if (card.items[i].test(v)) { counts[i]++; matched = true; break; }
          }
          if (!matched) { const ni = card.items.findIndex(i => i.none); if (ni >= 0) counts[ni]++; }
        }
      }
      return counts;
    };

    const curCounts = countItems(curRows, curField, curField2, curField3);
    const prevCounts = prevField ? countItems(prevRows, prevField, prevField2, prevField3) : card.items.map(() => 0);

    if (curCounts.every(c => c === 0)) continue;

    const itemCount = card.items.length;
    const span = itemCount >= 5 ? "grid-column:span 2;" : "";
    html += `<div style="${span}"><div class="chart-card" style="height:100%;">
      <h3>Participants who selected ${card.title.toLowerCase()}</h3>
      <div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;padding:16px 0;">
        ${card.items.map((item, i) => `<div style="text-align:center;min-width:70px;position:relative;cursor:default" data-tip="${prevY}: ${prevCounts[i]}\n${curYear}: ${curCounts[i]}">
          <div style="font-size:1.8rem;line-height:1">${item.icon}</div>
          <div style="font-size:1.5rem;font-weight:700;margin:4px 0">${curCounts[i]}</div>
          <div style="font-size:0.75rem;color:var(--text-muted)">${item.label}</div>
        </div>`).join("")}
      </div>
    </div></div>`;
  }

  container.innerHTML = html ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">${html}</div>` : "";
}

function updateUpsell() {
  const el = document.getElementById("upsell-section");
  if (filterTrips.size === 0 && filterGroup === "all") { el.innerHTML = ""; return; }

  const curYear = filterYear;
  const prevYear = getPrevYear();
  const fmt = v => "€" + v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });

  // Collect per-trip upsell data from detail APIs
  // Team-aware: total_price is only on head booker and covers the whole team
  const tripData = { cur: {}, prev: {} }; // tripBase → { base, total, count }

  for (const [pid, api] of Object.entries(DETAIL_APIS)) {
    const rows = detailData[pid];
    if (!rows || !rows.length) continue;
    const info = PROJECT_MAP[pid];
    if (!info) continue;
    const tripY = info.year;
    if (tripY !== curYear && tripY !== prevYear) continue;

    // Group rows by team to correctly attribute total_price
    const teams = {}; // teamKey → { members: [], headTotal: number }
    const solos = [];

    for (const r of rows) {
      const fakeRow = { project_id: Number(pid), tour_name: r.tour_name, period_date_start: r.period_date_start };
      const base = getTripBase(fakeRow);
      if (!passesTripFilter(base)) continue;
      if (filterLang !== "all") {
        const lang = (r.language || "").toLowerCase();
        const lg = lang === "nl" ? "NL" : lang === "fr" ? "FR" : lang === "de" ? "DE" : "EN";
        if (lg !== filterLang) continue;
      }

      const basePrice = parseFloat(r.trip_base_price) || 0;
      const totalPrice = parseFloat(r.total_price) || 0;

      if (r.team_id) {
        const tk = `${pid}_${r.team_id}`;
        if (!teams[tk]) teams[tk] = { members: [], headTotal: 0, base: base };
        teams[tk].members.push({ basePrice });
        if (totalPrice > 0) teams[tk].headTotal = totalPrice;
      } else {
        solos.push({ basePrice, totalPrice, base });
      }
    }

    const bucket = tripY === curYear ? tripData.cur : tripData.prev;

    // Process teams: total = head booker's total_price, base = sum of all members' base_price
    for (const team of Object.values(teams)) {
      const b = team.base;
      if (!bucket[b]) bucket[b] = { base: 0, total: 0, count: 0 };
      const teamBase = team.members.reduce((s, m) => s + m.basePrice, 0);
      bucket[b].base += teamBase;
      bucket[b].total += team.headTotal || teamBase; // fallback to base if no total
      bucket[b].count += team.members.length;
    }

    // Process solos normally
    for (const s of solos) {
      if (!bucket[s.base]) bucket[s.base] = { base: 0, total: 0, count: 0 };
      bucket[s.base].base += s.basePrice;
      bucket[s.base].total += s.totalPrice || s.basePrice;
      bucket[s.base].count++;
    }
  }

  const curTrips = Object.entries(tripData.cur);
  if (curTrips.length === 0) { el.innerHTML = ""; return; }

  // Aggregate totals
  let totalBase = 0, totalActual = 0, totalCount = 0;
  let prevBase = 0, prevActual = 0, prevCount = 0;
  for (const [, v] of curTrips) { totalBase += v.base; totalActual += v.total; totalCount += v.count; }
  for (const [, v] of Object.entries(tripData.prev)) { prevBase += v.base; prevActual += v.total; prevCount += v.count; }

  const totalUpsell = totalActual - totalBase;
  const avgUpsell = totalCount > 0 ? totalUpsell / totalCount : 0;
  const upsellPct = totalBase > 0 ? ((totalUpsell / totalBase) * 100).toFixed(1) : 0;
  const prevUpsell = prevActual - prevBase;
  const prevAvgUpsell = prevCount > 0 ? prevUpsell / prevCount : 0;

  const curS = String(curYear).slice(-2);
  const prevS = prevYear ? String(prevYear).slice(-2) : "";
  const hasPrev = prevCount > 0;

  // Bar chart: base vs upsell per trip (stacked)
  const tripNames = curTrips.sort((a, b) => b[1].total - a[1].total).map(e => e[0]);

  el.innerHTML = `
    <div class="charts-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 24px;">
      <div class="chart-card">
        <h3>Revenue breakdown — base vs extras</h3>
        <div class="chart-wrapper bar-h"><canvas id="ch-upsell-bar"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Upsell summary</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;padding:8px 0;">
          <div><div style="font-size:0.68rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.03em;">Total revenue '${curS}</div><div style="font-size:1.1rem;font-weight:700;">${fmt(totalActual)}</div></div>
          <div><div style="font-size:0.68rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.03em;">Base revenue '${curS}</div><div style="font-size:1.1rem;font-weight:700;">${fmt(totalBase)}</div></div>
          <div><div style="font-size:0.68rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.03em;">Extras revenue '${curS}</div><div style="font-size:1.1rem;font-weight:700;color:#16a34a;">${fmt(totalUpsell)}</div></div>
          <div><div style="font-size:0.68rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.03em;">Extras % of base</div><div style="font-size:1.1rem;font-weight:700;color:#16a34a;">${upsellPct}%</div></div>
          <div><div style="font-size:0.68rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.03em;">Avg extras/person '${curS}</div><div style="font-size:1.1rem;font-weight:700;">${fmt(avgUpsell)}</div></div>
          ${hasPrev ? `<div><div style="font-size:0.68rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.03em;">Avg extras/person '${prevS}</div><div style="font-size:1.1rem;font-weight:700;">${fmt(prevAvgUpsell)}</div></div>` : ""}
        </div>
      </div>
    </div>`;

  makeChart("ch-upsell-bar", {
    type: "bar",
    data: {
      labels: tripNames,
      datasets: [
        { label: "Base price", data: tripNames.map(t => Math.round(tripData.cur[t].base)), backgroundColor: "#60a5fa", borderRadius: 4 },
        { label: "Extras", data: tripNames.map(t => Math.round(tripData.cur[t].total - tripData.cur[t].base)), backgroundColor: "#34d399", borderRadius: 4 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: "top" },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ": €" + ctx.raw.toLocaleString() } },
      },
      scales: {
        x: { stacked: true, ticks: { font: { size: 10 } } },
        y: { stacked: true, beginAtZero: true, ticks: { callback: v => "€" + (v / 1000).toFixed(0) + "k" } },
      },
    },
  });
}

// ─── TARGETS ───────────────────────────────────────────────────────
function updateTargets() {
  if (filterYear === 2025) {
    document.getElementById("targets-section").innerHTML = "";
    return;
  }
  // Always compute targets from 2026 data, respecting trip + lang filters
  const data2026 = filteredAll().filter(r => getTripYear(r) === 2026);

  // Count booked per trip base + language breakdown
  const booked = {};
  const langCounts = {};
  for (const r of data2026) {
    const base = getTripBase(r);
    booked[base] = (booked[base] || 0) + 1;
    if (!langCounts[base]) langCounts[base] = {};
    const lang = (getLang(r) || "other").toLowerCase();
    langCounts[base][lang] = (langCounts[base][lang] || 0) + 1;
  }

  const langFilterKey = filterLang !== "all" ? filterLang.toLowerCase() : null;

  const TARGET_ORDER = [
    "The Canoe Trip Classic", "The Canoe Trip Short",
    "Canoe Tribe Classic", "Canoe Tribe Short",
    "The Canoe Trip Friesland",
    "The Kayak Trip",
    "The Packraft Trail Slovenia",
    "The Packraft Trail Semoy", "The Packraft Trail Mullerthal",
    "The Packraft Trail Biesbosch"
  ];
  const rows = Object.entries(TARGETS)
    .filter(([name]) => passesTripFilter(name))
    .sort((a, b) => {
      const ai = TARGET_ORDER.indexOf(a[0]);
      const bi = TARGET_ORDER.indexOf(b[0]);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    })
    .map(([name, t]) => {
      const count = booked[name] || 0;
      // When filtering by language, use the language-specific target
      const effectiveTarget = langFilterKey ? Math.round(t.target * (t[langFilterKey] || 0) / 100) : t.target;
      const capacity = t.capacity || 0;
      const pct = effectiveTarget > 0 ? Math.min((count / effectiveTarget) * 100, 120) : 0;
      const capPct = capacity > 0 ? ((count / capacity) * 100).toFixed(0) : 0;
      const colorClass = count >= effectiveTarget ? "over" : pct >= 75 ? "green" : pct >= 50 ? "yellow" : "red";
      const pctLabel = (effectiveTarget > 0 ? (count / effectiveTarget) * 100 : 0).toFixed(0) + "%";

      // Language breakdown — hide when filtering by a specific language
      let langBars = "";
      if (!langFilterKey) {
        const langs = langCounts[name] || {};
        langBars = ["nl", "fr", "de", "en"]
          .filter(l => t[l] > 0)
          .map(l => {
            const expected = Math.round(t.target * t[l] / 100);
            const actual = langs[l] || 0;
            const langPct = expected > 0 ? Math.min((actual / expected) * 100, 100) : 0;
            return `<div class="lang-item">
              <div class="lang-dot" style="background:${LANG_COLORS[l]}"></div>
              <span class="lang-text">${LANG_LABELS[l]}</span>
              <div class="lang-mini-bar"><div class="lang-mini-fill" style="width:${langPct}%;background:${LANG_COLORS[l]}"></div></div>
              <span class="lang-text"><strong>${actual}</strong>/${expected}</span>
            </div>`;
          }).join("");
      }

      return `
        <div class="target-group">
          <div class="target-row">
            <div class="target-label">${name}</div>
            <div class="target-bar-wrap">
              <div class="target-bar-fill ${colorClass}" style="width:${Math.min(pct, 100)}%">${pct >= 15 ? pctLabel : ""}</div>
            </div>
            <div class="target-stats"><strong>${count}</strong> / ${effectiveTarget}</div>
          </div>
          ${langBars ? `<div class="lang-breakdown">${langBars}</div>` : ""}
        </div>`;
    }).join("");

  document.getElementById("targets-section").innerHTML = `
    <div class="targets-card">
      <h3>${filterYear} Targets</h3>
      ${rows}
    </div>`;
}

// ─── WEEKLY TABLE ──────────────────────────────────────────────────
function getISOWeek(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  return Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7) + 1;
}

function updateWeeklyTable() {
  const el = document.getElementById("weekly-section");
  const curYear = filterYear;
  const prevYear = getPrevYear();
  const src = filteredAll();
  const langs = ["nl", "fr", "de"];

  function toLangKey(row) {
    const l = (getLang(row) || "").toLowerCase();
    return langs.includes(l) ? l : "en";
  }

  const weeksCur = {}, weeksPrev = {}, weeksCurLang = {};
  for (const r of src) {
    const y = getTripYear(r);
    if (y !== curYear && y !== prevYear) continue;
    const d = getDate(r);
    if (!d) continue;
    const wk = getISOWeek(d);
    if (y === prevYear) {
      weeksPrev[wk] = (weeksPrev[wk] || 0) + 1;
    } else if (y === curYear) {
      weeksCur[wk] = (weeksCur[wk] || 0) + 1;
      if (!weeksCurLang[wk]) weeksCurLang[wk] = { nl: 0, fr: 0, de: 0, en: 0 };
      weeksCurLang[wk][toLangKey(r)]++;
    }
  }

  const allWeeks = new Set([...Object.keys(weeksCur), ...Object.keys(weeksPrev)].map(Number));
  if (allWeeks.size === 0) { el.innerHTML = ""; return; }
  const allArr = [...allWeeks];
  const curWeekNums = Object.keys(weeksCur).map(Number);
  const lateWeeks = curWeekNums.filter(w => w >= 40);
  const seasonStart = lateWeeks.length ? Math.min(...lateWeeks) : (curWeekNums.length ? Math.min(...curWeekNums) : Math.min(...allArr));
  const maxLate = allArr.filter(w => w >= seasonStart).reduce((m, w) => Math.max(m, w), seasonStart - 1);
  const maxEarly = allArr.filter(w => w < seasonStart).reduce((m, w) => Math.max(m, w), 0);
  const weekNums = [];
  if (lateWeeks.length) {
    for (let w = seasonStart; w <= maxLate; w++) weekNums.push(w);
    for (let w = 1; w <= maxEarly; w++) weekNums.push(w);
  } else {
    const minWk = Math.min(...allArr);
    const maxWk = Math.max(...allArr);
    for (let w = minWk; w <= maxWk; w++) weekNums.push(w);
  }

  const currentWeek = getISOWeek(new Date().toISOString().slice(0, 10));

  let totalPrev = 0, totalCur = 0, runPrev = 0, runCur = 0;
  const totalLang = { nl: 0, fr: 0, de: 0, en: 0 };
  const rows = weekNums.map(w => {
    const vPrev = weeksPrev[w] || 0;
    const vCur = weeksCur[w] || 0;
    const lc = weeksCurLang[w] || { nl: 0, fr: 0, de: 0, en: 0 };
    totalPrev += vPrev;
    totalCur += vCur;
    runPrev += vPrev;
    runCur += vCur;
    for (const l of [...langs, "en"]) totalLang[l] += lc[l];
    const isCurrent = w === currentWeek;
    const v = (n) => n || "—";
    const d = vCur - vPrev;
    const diffClass = d > 0 ? "cell-pos" : d < 0 ? "cell-neg" : "";
    const diffText = d !== 0 ? (d > 0 ? "+" : "") + d : "—";
    return `<tr${isCurrent ? ' id="weekly-current-row"' : ""}>
      <td${isCurrent ? ' class="current-week"' : ""}>W${w}</td>
      ${prevYear ? `<td>${v(vPrev)}</td>` : ""}
      <td>${v(vCur)}</td>
      <td style="opacity:.5">${v(lc.nl)}</td>
      <td style="opacity:.5">${v(lc.fr)}</td>
      <td style="opacity:.5">${v(lc.de)}</td>
      <td style="opacity:.5">${v(lc.en)}</td>
      ${prevYear ? `<td class="${diffClass}">${diffText}</td>` : ""}
      <td style="font-weight:600;opacity:.7">${runCur}</td>
    </tr>`;
  }).join("");

  const diff = totalCur - totalPrev;
  const diffClass = diff > 0 ? "cell-pos" : diff < 0 ? "cell-neg" : "";
  el.innerHTML = `
    <div class="table-card ${weeklyCollapsed ? "collapsed" : ""}" id="weekly-card">
      <h3 onclick="weeklyCollapsed=!weeklyCollapsed;document.getElementById('weekly-card').classList.toggle('collapsed');if(!weeklyCollapsed)setTimeout(()=>{const r=document.getElementById('weekly-current-row');if(r)r.scrollIntoView({block:'center',behavior:'smooth'})},60)">Registrations per Week</h3>
      <div class="table-body">
        <div class="weekly-table-wrap">
        <table class="weekly-table">
          <thead><tr><th>Week</th>${prevYear ? `<th>${prevYear}</th>` : ""}<th>${curYear}</th><th>NL</th><th>FR</th><th>DE</th><th>EN</th>${prevYear ? "<th>+/−</th>" : ""}<th>Σ</th></tr></thead>
          <tbody>
            ${rows}
            <tr class="totals-row">
              <td>Total</td>
              ${prevYear ? `<td>${totalPrev}</td>` : ""}
              <td>${totalCur}</td>
              <td>${totalLang.nl}</td>
              <td>${totalLang.fr}</td>
              <td>${totalLang.de}</td>
              <td>${totalLang.en}</td>
              ${prevYear ? `<td class="${diffClass}">${diff > 0 ? "+" : ""}${diff}</td>` : ""}
              <td></td>
            </tr>
          </tbody>
        </table>
        </div>
      </div>
    </div>`;
}

// ─── REVENUE OVERVIEW ──────────────────────────────────────────────
function updateRevenueOverview() {
  // Remove old revenue card if exists, then append to scorecards
  const old = document.getElementById("revenue-card-inner");
  if (old) old.remove();
  const now = new Date();
  const currentYear = new Date().getFullYear();
  const yearOffset = currentYear - filterYear; // 0 for current year, 1 for last year, etc.
  const isHistorical = yearOffset > 0;

  // Shift reference dates back by yearOffset
  const ref = new Date(now);
  ref.setFullYear(ref.getFullYear() - yearOffset);
  const todayStr = ref.toISOString().slice(0, 10);
  const yesterdayStr = new Date(ref - 86400000).toISOString().slice(0, 10);
  const week7 = new Date(ref); week7.setDate(week7.getDate() - 7);
  const week7Str = week7.toISOString().slice(0, 10);
  const days30 = new Date(ref); days30.setDate(days30.getDate() - 30);
  const days30Str = days30.toISOString().slice(0, 10);

  const src = filtered();

  // Build team-aware price lookup: distribute head booker's total_price across team members
  // Each member gets: their base_price + (team_extras / team_size)
  const totalPriceLookup = {};
  for (const [pid, rows] of Object.entries(detailData)) {
    if (!rows) continue;
    totalPriceLookup[pid] = {};

    // Group by team
    const teams = {};
    for (const r of rows) {
      const tp = parseFloat(r.total_price) || 0;
      const bp = parseFloat(r.trip_base_price) || 0;
      const key = ((r.firstname || "") + "|" + (r.lastname || "") + "|" + (r.date_start_registration || "").slice(0, 10)).toLowerCase();

      if (r.team_id) {
        const tk = `${pid}_${r.team_id}`;
        if (!teams[tk]) teams[tk] = { members: [], headTotal: 0 };
        teams[tk].members.push({ key, bp });
        if (tp > 0) teams[tk].headTotal = tp;
      } else {
        totalPriceLookup[pid][key] = tp || bp;
      }
    }

    // Distribute team total across members proportionally by base price
    for (const team of Object.values(teams)) {
      const teamBase = team.members.reduce((s, m) => s + m.bp, 0);
      const teamTotal = team.headTotal || teamBase;
      const teamExtras = teamTotal - teamBase;
      for (const m of team.members) {
        // Each member: their base + their share of extras (proportional to base price)
        const share = teamBase > 0 ? (m.bp / teamBase) * teamExtras : 0;
        totalPriceLookup[pid][m.key] = m.bp + share;
      }
    }
  }

  function getTotalPrice(r) {
    const pid = String(r.project_id);
    const lookup = totalPriceLookup[pid];
    if (!lookup) return getPrice(r);
    const key = ((r.firstname || "") + "|" + (r.lastname || "") + "|" + (getDate(r) || "").slice(0, 10)).toLowerCase();
    return lookup[key] !== undefined ? lookup[key] : getPrice(r);
  }

  let baseToday = 0, baseYesterday = 0, base7d = 0, base30d = 0, baseTotal = 0;
  let totalToday = 0, totalYesterday = 0, total7d = 0, total30d = 0, totalTotal = 0;
  for (const r of src) {
    const d = (getDate(r) || "").slice(0, 10);
    const bp = getPrice(r);
    const tp = getTotalPrice(r);
    baseTotal += bp;
    totalTotal += tp;
    if (d === todayStr) { baseToday += bp; totalToday += tp; }
    if (d === yesterdayStr) { baseYesterday += bp; totalYesterday += tp; }
    if (d >= week7Str && d <= todayStr) { base7d += bp; total7d += tp; }
    if (d >= days30Str && d <= todayStr) { base30d += bp; total30d += tp; }
  }

  // Revenue target = sum of (target participants × avg total price per participant per trip)
  const avgPrice = {};
  const tripCounts = {};
  for (const r of src) {
    const base = getTripBase(r);
    const tp = getTotalPrice(r);
    avgPrice[base] = (avgPrice[base] || 0) + tp;
    tripCounts[base] = (tripCounts[base] || 0) + 1;
  }

  const langKey = filterLang !== "all" ? filterLang.toLowerCase() : null;
  let revTarget = 0;
  for (const [name, t] of Object.entries(TARGETS)) {
    if (!passesTripFilter(name)) continue;
    const avg = tripCounts[name] ? avgPrice[name] / tripCounts[name] : 0;
    const targetCount = langKey ? Math.round(t.target * (t[langKey] || 0) / 100) : t.target;
    revTarget += targetCount * avg;
  }

  const pct = revTarget > 0 ? ((totalTotal / revTarget) * 100).toFixed(1) : 0;
  const VAT = 1.0273;
  const fmt = v => "€" + v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const exVat = v => fmt(Math.round(v / VAT));
  const rvTip = v => `data-tip="Excl. VAT: ${exVat(v)}"`;

  const card = document.createElement("div");
  card.id = "revenue-card-inner";
  card.className = "revenue-card";
  const refDate = ref.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  const suffix = isHistorical ? ` (${refDate})` : "";
  const titleNote = isHistorical ? ` — as of this day in ${filterYear}` : "";

  const hasDetail = totalTotal !== baseTotal;
  const extrasTotal = totalTotal - baseTotal;

  card.innerHTML = `
    <h3>Revenue${titleNote}</h3>
    <div class="revenue-rows">
      <div class="revenue-row"><span class="rev-label">${isHistorical ? "This day" : "Today"}${suffix}</span><span class="rev-value" ${rvTip(totalToday)}>${fmt(totalToday)}</span></div>
      <div class="revenue-row"><span class="rev-label">${isHistorical ? "Day before" : "Yesterday"}</span><span class="rev-value" ${rvTip(totalYesterday)}>${fmt(totalYesterday)}</span></div>
      <div class="revenue-row"><span class="rev-label">7 days${suffix}</span><span class="rev-value" ${rvTip(total7d)}>${fmt(total7d)}</span></div>
      <div class="revenue-row"><span class="rev-label">30 days${suffix}</span><span class="rev-value" ${rvTip(total30d)}>${fmt(total30d)}</span></div>
      <div class="revenue-row rev-highlight"><span class="rev-label">Total ${filterYear}</span><span class="rev-value" ${rvTip(totalTotal)}>${fmt(totalTotal)}</span></div>
      ${hasDetail ? `<div class="revenue-row" style="opacity:.6"><span class="rev-label">↳ Base price</span><span class="rev-value" ${rvTip(baseTotal)}>${fmt(baseTotal)}</span></div>
      <div class="revenue-row" style="opacity:.6"><span class="rev-label">↳ Extras</span><span class="rev-value" ${rvTip(extrasTotal)}>${fmt(extrasTotal)}</span></div>
      <div></div>` : `<div></div><div></div><div></div>`}
      ${!isHistorical ? `<div class="revenue-row rev-target" style="grid-column: 1 / -1"><span class="rev-label">Target ${filterYear}</span><span class="rev-value" ${rvTip(revTarget)}>${fmt(revTarget)}<span class="rev-pct">${pct}%</span></span></div>` : ""}
    </div>`;
  document.getElementById("scorecards-secondary").appendChild(card);
}

function updatePaceTrackerCard() {
  const old = document.getElementById("pace-card-inner");
  if (old) old.remove();

  if (filterYear === 2025) return;

  const src = filteredAll().filter(r => getTripYear(r) === filterYear);
  if (src.length === 0) return;

  const langKey = filterLang !== "all" ? filterLang.toLowerCase() : null;
  const relevantTargets = Object.entries(TARGETS).filter(([name]) => passesTripFilter(name));
  const totalTarget = relevantTargets.reduce((s, [, t]) => s + (langKey ? Math.round(t.target * (t[langKey] || 0) / 100) : t.target), 0);
  if (totalTarget === 0) return;

  const totalBooked = src.length;
  const regDates = src.map(r => getDate(r)).filter(Boolean).map(d => d.slice(0, 10)).sort();
  const firstBooking = regDates[0];
  const allForEnd = allData.filter(r => getTripYear(r) === filterYear && passesTripFilter(getTripBase(r)));
  const periodDates = allForEnd.map(r => (r.period_date_start || "").slice(0, 10)).filter(Boolean).sort();
  const endDate = periodDates[periodDates.length - 1];
  if (!firstBooking || !endDate) return;

  const today = new Date().toISOString().slice(0, 10);
  const msDay = 86400000;
  const startMs = new Date(firstBooking).getTime();
  const endMs = new Date(endDate).getTime();
  const todayMs = new Date(today).getTime();
  const totalDays = Math.max(1, Math.round((endMs - startMs) / msDay));
  const daysElapsed = Math.max(1, Math.round((todayMs - startMs) / msDay));
  const daysRemaining = Math.max(0, Math.round((endMs - todayMs) / msDay));
  const remaining = totalTarget - totalBooked;
  const neededPerDay = daysRemaining > 0 ? remaining / daysRemaining : 0;
  const currentPace = totalBooked / daysElapsed;
  const pctSeason = Math.round((daysElapsed / totalDays) * 100);

  // ── 2025-curve-based "should be today" ──
  // Get 2025 data for the same trip(s), build cumulative booking curve
  const prevYear = getPrevYear();
  let shouldBeToday, curveLabel;
  if (prevYear) {
    const prev = allData.filter(r => getTripYear(r) === prevYear && passesTripFilter(getTripBase(r)));
    const prevRegDates = prev.map(r => getDate(r)).filter(Boolean).map(d => d.slice(0, 10)).sort();
    if (prevRegDates.length > 20) {
      // Build 2025 cumulative curve as % of total by elapsed fraction
      const prevPeriodDates = prev.map(r => (r.period_date_start || "").slice(0, 10)).filter(Boolean).sort();
      const prevEnd = prevPeriodDates[prevPeriodDates.length - 1];
      const prevStart = prevRegDates[0];
      const prevStartMs = new Date(prevStart).getTime();
      const prevEndMs = new Date(prevEnd).getTime();
      const prevTotalDays = Math.max(1, Math.round((prevEndMs - prevStartMs) / msDay));
      const prevTotal = prev.length;

      // Count how many bookings were in by each day fraction
      const prevCumByFrac = [];
      let cum = 0;
      for (const d of prevRegDates) {
        cum++;
        const dayNum = Math.round((new Date(d).getTime() - prevStartMs) / msDay);
        const frac = Math.min(1, dayNum / prevTotalDays);
        prevCumByFrac.push({ frac, pct: cum / prevTotal });
      }

      // Find what % of 2025 bookings were in at the current season fraction
      const currentFrac = Math.min(1, daysElapsed / totalDays);
      let pct2025 = 0;
      for (const p of prevCumByFrac) {
        if (p.frac <= currentFrac) pct2025 = p.pct;
        else break;
      }

      shouldBeToday = Math.round(totalTarget * pct2025);
      curveLabel = `Based on ${prevYear} curve (${Math.round(pct2025 * 100)}% by this point)`;
    } else {
      // Not enough 2025 data, fall back to linear
      shouldBeToday = Math.round(totalTarget * (daysElapsed / totalDays));
      curveLabel = "Linear (insufficient 2025 data)";
    }
  } else {
    shouldBeToday = Math.round(totalTarget * (daysElapsed / totalDays));
    curveLabel = "Linear";
  }

  const projected = Math.round(totalBooked / (shouldBeToday / totalTarget || daysElapsed / totalDays));
  const delta = totalBooked - shouldBeToday;
  const statusClass = delta >= 0 ? "pace-good" : delta > -totalTarget * 0.1 ? "pace-warn" : "pace-bad";
  const statusText = delta >= 0 ? `+${delta} ahead` : `${delta} behind`;

  const card = document.createElement("div");
  card.id = "pace-card-inner";
  card.className = "pace-card";
  card.innerHTML = `
    <h3>Pace Tracker</h3>
    <div class="pace-rows">
      <div class="pace-row" data-tip="End date (${endDate}) minus today (${today})"><span class="pace-label">Days remaining</span><span class="pace-value">${daysRemaining}</span></div>
      <div class="pace-row" data-tip="Days elapsed (${daysElapsed}) / total season (${totalDays} days)"><span class="pace-label">Season progress</span><span class="pace-value">${pctSeason}%</span></div>
      <div class="pace-row ${statusClass}" data-tip="${curveLabel}\nBooked: ${totalBooked} / Expected: ${shouldBeToday}"><span class="pace-label">vs expected pace</span><span class="pace-value">${statusText}</span></div>
      <div class="pace-row" data-tip="Booked (${totalBooked}) / days elapsed (${daysElapsed})"><span class="pace-label">Current pace/day</span><span class="pace-value">${currentPace.toFixed(1)}</span></div>
      <div class="pace-row" data-tip="Remaining (${remaining}) / days left (${daysRemaining})"><span class="pace-label">Needed/day</span><span class="pace-value">${neededPerDay > 0 ? neededPerDay.toFixed(1) : "—"}</span></div>
      <div class="pace-row pace-highlight" data-tip="Based on current booking rate vs ${prevYear || 'linear'} curve"><span class="pace-label">Projected total</span><span class="pace-value">${projected.toLocaleString()} / ${totalTarget.toLocaleString()}</span></div>
    </div>`;
  document.getElementById("scorecards-secondary").appendChild(card);
}

// ─── SEASON TIMELINE ───────────────────────────────────────────────
function updateSeasonTimeline() {
  const el = document.getElementById("season-timeline");
  const elInline = document.getElementById("season-inline");
  const curYear = filterYear;
  const data = filteredAll().filter(r => {
    const d = r.period_date_start || r.date_start_registration;
    return d && new Date(d).getFullYear() === curYear;
  });
  if (!data.length) { el.innerHTML = ""; elInline.innerHTML = ""; return; }

  const tripDates = {};
  for (const r of data) {
    const base = getTripBase(r);
    if (!base) continue;
    const ds = (r.period_date_start || "").slice(0, 10);
    if (!ds) continue;
    if (!tripDates[base]) tripDates[base] = { min: ds, max: ds };
    if (ds < tripDates[base].min) tripDates[base].min = ds;
    if (ds > tripDates[base].max) tripDates[base].max = ds;
  }

  const trips = Object.entries(tripDates);
  if (!trips.length) { el.innerHTML = ""; return; }

  const fmt = dt => new Date(dt).toLocaleDateString("en", { day: "numeric", month: "short" });
  const fmtFull = dt => new Date(dt).toLocaleDateString("en", { day: "numeric", month: "short", year: "numeric" });
  const today = new Date();

  // ── Single trip: compact inline view at top ──
  if (trips.length === 1) {
    el.innerHTML = "";
    const [name, d] = trips[0];
    const start = new Date(d.min);
    const end = new Date(d.max);
    const beforeSeason = today < start;
    const daysUntil = Math.ceil((start - today) / 86400000);
    const remaining = Math.max(Math.ceil((end - today) / 86400000), 0);

    const startSub = beforeSeason ? `in ${daysUntil} day${daysUntil !== 1 ? "s" : ""}` : "started";
    const endSub = today > end ? "ended" : `${remaining} day${remaining !== 1 ? "s" : ""} remaining`;

    elInline.innerHTML = `<div class="scorecards">
      <div class="scorecard">
        <div class="scorecard-label">Season starts</div>
        <div class="scorecard-value" style="font-size:1.3rem;">${fmt(d.min)}</div>
        <div class="scorecard-sub">${startSub}</div>
      </div>
      <div class="scorecard">
        <div class="scorecard-label">Season ends</div>
        <div class="scorecard-value" style="font-size:1.3rem;">${fmt(d.max)}</div>
        <div class="scorecard-sub">${endSub}</div>
      </div>
    </div>`;
    return;
  }
  elInline.innerHTML = "";

  // ── Multiple trips: full Gantt chart ──
  const allMins = trips.map(([, d]) => d.min);
  const allMaxs = trips.map(([, d]) => d.max);
  const globalMin = new Date(allMins.reduce((a, b) => a < b ? a : b));
  const globalMax = new Date(allMaxs.reduce((a, b) => a > b ? a : b));
  globalMin.setDate(globalMin.getDate() - 14);
  globalMax.setDate(globalMax.getDate() + 14);
  const totalDays = (globalMax - globalMin) / 86400000 || 1;

  const order = typeof TARGET_ORDER !== "undefined" ? TARGET_ORDER : [];
  trips.sort((a, b) => {
    const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  const todayPct = Math.max(0, Math.min(100, ((today - globalMin) / 86400000) / totalDays * 100));

  const months = [];
  const mStart = new Date(globalMin.getFullYear(), globalMin.getMonth() + 1, 1);
  while (mStart <= globalMax) {
    const pct = ((mStart - globalMin) / 86400000) / totalDays * 100;
    if (pct > 0 && pct < 100) months.push({ label: mStart.toLocaleString("en", { month: "short" }), pct });
    mStart.setMonth(mStart.getMonth() + 1);
  }

  const rowH = 32;
  const totalH = trips.length * rowH;

  const bars = trips.map(([name, d], i) => {
    const startPct = ((new Date(d.min) - globalMin) / 86400000) / totalDays * 100;
    const endPct = ((new Date(d.max) - globalMin) / 86400000) / totalDays * 100;
    const width = Math.max(endPct - startPct, 0.8);
    const color = (typeof TRIP_COLORS !== "undefined" && TRIP_COLORS[name]) || "var(--accent)";
    const isActive = filterTrips.size === 0 || filterTrips.has(name);
    const op = isActive ? 1 : 0.25;
    const top = i * rowH;
    return `<div style="position:absolute;left:0;right:0;top:${top}px;height:${rowH}px;display:flex;align-items:center;">
      <div data-tip="${fmt(d.min)} – ${fmt(d.max)}" style="position:absolute;left:${startPct}%;width:${width}%;height:16px;background:${color};border-radius:8px;opacity:${op};transition:opacity 0.2s;cursor:default;"></div>
      <span style="position:absolute;left:${Math.max(startPct - 0.5, 0)}%;transform:translateX(-100%);padding-right:8px;font-size:0.7rem;color:var(--text-muted);white-space:nowrap;opacity:${op}">${name}</span>
    </div>`;
  }).join("");

  const gridLines = months.map(m =>
    `<div style="position:absolute;left:${m.pct}%;top:0;bottom:0;width:1px;background:var(--text-muted);opacity:0.1;"></div>`
  ).join("");

  const monthLabels = months.map(m =>
    `<span style="position:absolute;left:${m.pct}%;transform:translateX(-50%);font-size:0.65rem;color:var(--text-muted);letter-spacing:0.5px;">${m.label}</span>`
  ).join("");

  el.innerHTML = `<div class="chart-card full-width" style="margin-bottom:24px;">
    <h3>TRIP SEASON ${curYear}</h3>
    <div style="position:relative;margin-left:220px;margin-right:16px;">
      <div style="position:relative;height:${totalH}px;">
        ${gridLines}
        <div style="position:absolute;left:${todayPct}%;top:-4px;bottom:-4px;width:2px;background:var(--accent);opacity:0.4;border-radius:1px;z-index:2;"></div>
        <div style="position:absolute;left:${todayPct}%;top:-16px;transform:translateX(-50%);font-size:0.6rem;color:var(--accent);font-weight:600;z-index:2;">Today</div>
        ${bars}
      </div>
      <div style="position:relative;height:20px;margin-top:8px;">
        ${monthLabels}
      </div>
    </div>
  </div>`;
}

// ─── UPDATE ALL ────────────────────────────────────────────────────
function updateFilterNotice() {
  const el = document.getElementById("filter-notice");
  const NOTICES = {
    "The Packraft Trail Semoy": "2025 comparison data comes from The Packraft Trail Ardennes (trips starting Apr 5 – Jun 14), which was split into Semoy and Mullerthal for 2026.",
    "The Packraft Trail Mullerthal": "2025 comparison data comes from The Packraft Trail Ardennes (trips starting Jun 15 – Oct 5), which was split into Semoy and Mullerthal for 2026.",
  };
  const notices = [...filterTrips].map(t => NOTICES[t]).filter(Boolean);
  if (notices.length > 0) {
    el.textContent = "ℹ " + notices.join(" | ");
    el.style.display = "";
  } else {
    el.style.display = "none";
  }
}

function updateAll() {
  tableLimit = 15; // reset when filters change
  const data = filtered();
  const isMulti = filterTrips.size !== 1; // showing multiple trips (all, group, or multi-select)

  updateFilterNotice();
  updateScorecards(data);
  updateRevenueOverview();
  updatePaceTrackerCard();
  updateTimeline(data);
  updateWebVisits();
  updateCountry(data);
  updateLang(data);
  updateBookingStatus();
  updateCapacity();
  updateTransport();
  updateDetailCards();
  updatePersonas();
  updateLeads();
  updateSeasonTimeline();
  updateReferrals();
  updateUpsell();
  updateTargets();
  updateSegmentCharts();
  updateWeekShort();
  updateWeeklyTable();
  updateAge(data);
  updateGender();
  updateAgeByTrip(data);
  updateReviews();
  updateTeamSize();
  updateTeamDist();
  updateTable(data);

  // Only show these when viewing multiple trips — they're redundant for a single trip
  const tourEl = document.getElementById("card-tour");
  const yoyEl = document.getElementById("card-yoy");
  const revEl = document.getElementById("card-revenue");
  if (tourEl) tourEl.style.display = isMulti ? "" : "none";
  if (yoyEl) yoyEl.style.display = isMulti ? "" : "none";
  if (revEl) revEl.style.display = isMulti ? "" : "none";

  if (isMulti) {
    updateTour(data);
    updateYoY();
    updateRevenue(data);
  }

  // Hide booking details card if all inner sections are empty
  const bdCard = document.getElementById("booking-details-card");
  if (bdCard) {
    const hasContent = ["transport-section", "detail-cards", "upsell-section"]
      .some(id => { const el = document.getElementById(id); return el && el.innerHTML.trim(); });
    bdCard.style.display = hasContent ? "" : "none";
  }

  updateFooter();
}

function updateFooter() {
  document.getElementById("footer").innerHTML =
    `Last refreshed: ${lastRefreshed ? lastRefreshed.toLocaleString() : "—"} · ${allData.length} participants loaded · Travelbase Dashboard`;
}

// ─── API RESPONSES VIEWER ──────────────────────────────────────────
function showApiResponses() {
  let existing = document.getElementById("api-modal");
  if (existing) { existing.remove(); return; }

  const modal = document.createElement("div");
  modal.id = "api-modal";
  modal.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;";
  modal.onclick = e => { if (e.target === modal) modal.remove(); };

  // Build tabs: unified + each detail API
  const tabs = [{ label: "Unified Export", key: "unified" }];
  for (const [pid, rows] of Object.entries(detailData)) {
    if (!rows?.length) continue;
    const info = PROJECT_MAP[pid];
    const label = info ? `${info.label} ${info.year}` : `PID ${pid}`;
    tabs.push({ label, key: pid });
  }

  const content = document.createElement("div");
  content.style.cssText = "background:var(--bg-card);border-radius:12px;width:90vw;max-width:1000px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;";

  const header = document.createElement("div");
  header.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);";
  header.innerHTML = `<h3 style="margin:0;font-size:1rem;">API Responses</h3><button onclick="document.getElementById('api-modal').remove()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text);">✕</button>`;

  const tabBar = document.createElement("div");
  tabBar.style.cssText = "display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0;";

  const body = document.createElement("div");
  body.style.cssText = "flex:1;overflow:auto;padding:16px 20px;";
  body.id = "api-modal-body";

  function showTab(key) {
    tabBar.querySelectorAll("button").forEach(b => b.style.borderBottom = b.dataset.key === key ? "2px solid var(--accent)" : "2px solid transparent");
    let rows, fields;
    if (key === "unified") {
      rows = allData;
      fields = rows.length ? Object.keys(rows[0]) : [];
    } else {
      rows = detailData[key] || [];
      fields = rows.length ? Object.keys(rows[0]) : [];
    }

    const sample = rows.slice(0, 5);
    body.innerHTML = `
      <div style="margin-bottom:12px;font-size:0.8rem;color:var(--text-muted);">
        ${rows.length} rows · ${fields.length} fields
      </div>
      <div style="margin-bottom:16px;">
        <strong style="font-size:0.8rem;">Available fields:</strong>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">
          ${fields.map(f => `<span style="padding:2px 8px;border-radius:4px;background:var(--bg);font-size:0.72rem;border:1px solid var(--border);">${f}</span>`).join("")}
        </div>
      </div>
      <div style="margin-bottom:8px;font-size:0.8rem;"><strong>Sample rows (first 5):</strong></div>
      <div style="overflow-x:auto;">
        <table style="font-size:0.7rem;border-collapse:collapse;width:100%;">
          <thead><tr>${fields.map(f => `<th style="padding:4px 8px;border:1px solid var(--border);background:var(--bg);white-space:nowrap;position:sticky;top:0;">${f}</th>`).join("")}</tr></thead>
          <tbody>${sample.map(r => `<tr>${fields.map(f => `<td style="padding:3px 8px;border:1px solid var(--border);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;">${r[f] ?? ""}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
      </div>
      <div style="margin-top:16px;">
        <strong style="font-size:0.8rem;">Unique values per field:</strong>
        <div style="margin-top:8px;font-size:0.72rem;">
          ${fields.map(f => {
            const vals = [...new Set(rows.map(r => r[f]).filter(v => v != null && v !== ""))];
            if (vals.length > 20) return `<div style="margin-bottom:6px;"><strong>${f}</strong>: ${vals.length} unique values</div>`;
            return `<div style="margin-bottom:6px;"><strong>${f}</strong>: ${vals.slice(0, 15).map(v => `<span style="padding:1px 6px;border-radius:3px;background:var(--bg);border:1px solid var(--border);margin:1px;">${String(v).slice(0, 40)}</span>`).join(" ")}${vals.length > 15 ? ` (+${vals.length - 15} more)` : ""}</div>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  tabs.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = t.label;
    btn.dataset.key = t.key;
    btn.style.cssText = "padding:8px 16px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:0.75rem;color:var(--text);white-space:nowrap;";
    btn.onclick = () => showTab(t.key);
    tabBar.appendChild(btn);
  });

  content.appendChild(header);
  content.appendChild(tabBar);
  content.appendChild(body);
  modal.appendChild(content);
  document.body.appendChild(modal);

  showTab("unified");
}

// ─── THEME ─────────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === "dark" ? "light" : "dark";
  html.dataset.theme = next;
  document.getElementById("theme-btn").textContent = next === "dark" ? "Light" : "Dark";
  localStorage.setItem("tb-theme", next);
  updateChartColors();
  updateAll();
}

function initTheme() {
  const saved = localStorage.getItem("tb-theme");
  if (saved === "dark") {
    document.documentElement.dataset.theme = "dark";
    document.getElementById("theme-btn").textContent = "Light";
  }
}

// ─── INIT ──────────────────────────────────────────────────────────
async function refreshData() {
  try {
    await fetchAll();
    updateAll();
  } catch (err) {
    console.error("Refresh failed:", err);
  }
}

// Scroll-to-top visibility
const scrollBtn = document.getElementById("scroll-top");
document.addEventListener("scroll", () => {
  scrollBtn.classList.toggle("visible", window.scrollY > 400);
}, { passive: true });

async function init() {
  initTheme();
  chartDefaults();
  buildScorecards();
  buildCharts();

  try {
    await fetchAll();
  } catch (err) {
    document.getElementById("loading").innerHTML = `<div style="color:#ef4444;font-size:0.9rem;">Failed to load data: ${err.message}</div>`;
    return;
  }

  buildFilters(); // build after data so we know which years/categories exist
  document.getElementById("loading").classList.add("hidden");
  updateAll();
}

init();
