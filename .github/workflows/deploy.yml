name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT: travelbase-apps
  REGION: europe-west1
  SERVICE: paddle-dashboard

permissions:
  contents: read
  id-token: write            # for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          # Built from source via Cloud Build (no private deps, so no BuildKit
          # secret needed — unlike app-roadtrip-africa).
          #
          # ingress=all (not internal-and-cloud-load-balancing): the apps-gateway
          # reverse-proxies to this service's public *.run.app URL, so locking
          # ingress to the LB returns a Google 404. Auth is still enforced — only
          # apps-gateway@ holds run.invoker and the gateway sends an ID token.
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$REGION" \
            --source . \
            --labels "app=paddle-dashboard" \
            --ingress all \
            --no-allow-unauthenticated \
            --service-account "paddle-dashboard@${GCP_PROJECT}.iam.gserviceaccount.com"
